<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Tarefas Escolar</title>
    
    <!-- Otimizações de Performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://script.google.com">
    
    <!-- CSS Externo -->
    <link rel="stylesheet" href="https://professorsesi176.github.io/tarefas/style.css">
    
    <!-- Bibliotecas JavaScript -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="min-h-screen flex items-start justify-center p-4 sm:p-8">
    <div id="app-container" class="w-full max-w-7xl bg-white shadow-xl rounded-2xl p-6 sm:p-8 transition-all duration-300">
        <header class="mb-8 border-b pb-4">
            <div class="header-content">
                <h1 class="text-3xl font-extrabold text-red-700 text-center">Sistema de Gestão de Tarefas</h1>
                <div id="user-info" class="user-info-container text-center mt-2 text-gray-600"></div>
                <div class="absolute top-0 right-0 flex space-x-2">
                    <button id="tarefasBtn" class="btn-tarefas hidden">Tarefas</button>
                    <button id="graficosBtn" class="btn-primario hidden" style="background-color: #8b5cf6;">Gráficos</button>
                    <button id="diagnosticoBtn" class="btn-primario hidden">Diagnóstico</button>
                    <button id="relatorioBtn" class="btn-primario hidden" style="background-color: #10b981;">Relatório</button>
                    <button onclick="logout()" id="logoutBtn" class="btn-secundario hidden">Sair</button>
                </div>
            </div>
        </header>

        <div id="content-area"></div>

        <footer class="mt-8 pt-4 border-t text-xs text-gray-500 text-center">
            Desenvolvido por Geovane Modena | Versão 36.0.1 - Sistema de 4 Períodos
        </footer>
    </div>

    <!-- Modal Principal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title" class="text-lg font-bold mb-2"></h3>
            <p id="modal-message" class="text-gray-700"></p>
            <button onclick="closeModal()" class="btn-primario w-full mt-4">Fechar</button>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO E CONSTANTES ====================
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbx3n_ZZobnfty_21WjCTJ5t4Yb0UblaNZ1TCGTi-NKbpPfQXlZAEm8Bb7oSLSyR5T_OUA/exec",
            CACHE_TTL: 5 * 60 * 1000, // 5 minutos
            MAX_TEMA_LEN: 200,
            MAX_PARTE_LEN: 4000,
            TURMAS: ["1A", "1B", "2A", "2B", "3A", "3B"],
            PERIODOS: {
                1: "1º Período",
                2: "2º Período",
                3: "3º Período",
                4: "4º Período"
            }
        };

        // ==================== ESTRUTURA DA TAREFA ====================
        const ESTRUTURA_TAREFA = {
            COLUNAS_POR_TAREFA: 12,
            COLUNAS_POR_PARTE: 3,
            NUMERO_PARTES: 4,
            COLUNAS_MEDIAS: 4
        };

        // ==================== ESTADO GLOBAL ====================
        const STATE = {
            usuarioLogado: null,
            tarefas: [],
            tarefaEditando: null,
            contadoresAtivos: [],
            rmVisible: false,
            relatorioAlunoVisivel: false,
            metricasPerformance: {
                chamadasAPI: 0,
                tempoTotal: 0,
                memoriaUsada: 0,
                memoriaTotal: 0
            },
            graficos: {
                periodoComparativo: null,
                evolucaoIndividual: null,
                desempenhoTurma: null
            }
        };

        // ==================== SISTEMA DE CACHE ====================
        const CacheManager = {
            get: (key) => {
                try {
                    const item = localStorage.getItem(`task_${key}`);
                    if (item) {
                        const { data, expiry } = JSON.parse(item);
                        if (Date.now() > expiry) {
                            localStorage.removeItem(`task_${key}`);
                            return null;
                        }
                        return data;
                    }
                } catch (e) {
                    console.warn('Erro ao acessar cache:', e);
                }
                return null;
            },
            
            set: (key, data, ttl = CONFIG.CACHE_TTL) => {
                try {
                    const item = {
                        data,
                        expiry: Date.now() + ttl
                    };
                    localStorage.setItem(`task_${key}`, JSON.stringify(item));
                    return true;
                } catch (e) {
                    console.warn('Erro ao salvar no cache:', e);
                    return false;
                }
            },
            
            remove: (key) => {
                try {
                    localStorage.removeItem(key.startsWith('task_') ? key : `task_${key}`);
                } catch (e) {
                    console.warn('Erro ao remover do cache:', e);
                }
            },
            
            clear: () => {
                try {
                    const keys = Object.keys(localStorage).filter(k => k.startsWith('task_'));
                    keys.forEach(k => localStorage.removeItem(k));
                } catch (e) {
                    console.warn('Erro ao limpar cache:', e);
                }
            },

            getCacheStats: () => {
                try {
                    const keys = Object.keys(localStorage).filter(k => k.startsWith('task_'));
                    const totalItens = keys.length;
                    let tamanhoTotal = 0;
                    
                    keys.forEach(key => {
                        const item = localStorage.getItem(key);
                        if (item) {
                            tamanhoTotal += new Blob([item]).size;
                        }
                    });
                    
                    const eficiencia = totalItens > 0 ? Math.min(100, (totalItens / 100) * 100) : 0;
                    
                    return {
                        itens: totalItens,
                        tamanho: tamanhoTotal,
                        eficiencia: eficiencia
                    };
                } catch (e) {
                    console.warn('Erro ao calcular estatísticas do cache:', e);
                    return { itens: 0, tamanho: 0, eficiencia: 0 };
                }
            }
        };

        // ==================== UTILITÁRIOS ====================
        const Utils = {
            debounce: (func, wait, immediate = false) => {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        timeout = null;
                        if (!immediate) func(...args);
                    };
                    const callNow = immediate && !timeout;
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                    if (callNow) func(...args);
                };
            },

            formatarData: (dataISO) => {
                if (!dataISO) return 'N/A';
                const data = new Date(dataISO);
                return isNaN(data.getTime()) ? 'N/A' : data.toLocaleDateString('pt-BR');
            },

            escapeHTML: (texto) => {
                if (!texto) return '';
                return String(texto)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            },

            setButtonLoading: (button, isLoading) => {
                if (!button) return;
                if (isLoading) {
                    button.disabled = true;
                    button.classList.add('btn-excluir-loading');
                } else {
                    button.disabled = false;
                    button.classList.remove('btn-excluir-loading');
                }
            },

            formatarConteudoParaExibicao: (texto) => {
                if (!texto) return '';
                const textoStr = String(texto);
                return textoStr
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;')
                    .replace(/\n/g, '<br>');
            },

            formatarBytes: (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            },

            validarLink: (link) => {
                if (!link || typeof link !== 'string') return false;
                
                let linkTrimmed = link.trim();
                if (linkTrimmed === '') return false;
                
                if (!/^https?:\/\//i.test(linkTrimmed)) {
                    linkTrimmed = 'https://' + linkTrimmed;
                }
                
                try {
                    new URL(linkTrimmed);
                    return linkTrimmed.length >= 5;
                } catch {
                    return false;
                }
            },

            isDateString: (value) => {
                if (!value || typeof value !== 'string') return false;
                const date = new Date(value);
                return !isNaN(date.getTime()) && value.includes('-') && value.includes('T');
            },

            isNotaValida: (value) => {
                if (value === null || value === undefined) return false;
                const num = parseFloat(value);
                return !isNaN(num) && (num === 0 || num === 2 || num === 2.5);
            },

            calcularPosicaoCelula: (linha, coluna) => {
                let colunaLetra = '';
                let tempColuna = coluna;
                
                while (tempColuna > 0) {
                    const resto = (tempColuna - 1) % 26;
                    colunaLetra = String.fromCharCode(65 + resto) + colunaLetra;
                    tempColuna = Math.floor((tempColuna - 1) / 26);
                }
                
                return `${colunaLetra}${linha}`;
            },

            formatarDataHora: (dataISO) => {
                if (!dataISO) return 'N/A';
                try {
                    const data = new Date(dataISO);
                    return isNaN(data.getTime()) ? 'N/A' : data.toLocaleString('pt-BR');
                } catch {
                    return 'N/A';
                }
            },

            formatarDadoBruto: (valor) => {
                if (valor === null || valor === undefined || valor === '') {
                    return 'N/A';
                }
                
                const tipo = typeof valor;
                const valorStr = String(valor);
                
                if (Utils.isDateString(valorStr)) {
                    return Utils.formatarDataHora(valorStr);
                }
                
                if (!isNaN(parseFloat(valorStr)) && valorStr.trim() !== '') {
                    const num = parseFloat(valorStr);
                    return num % 1 === 0 ? num.toString() : num.toFixed(1);
                }
                
                return valorStr;
            },

            formatarNota: (nota) => {
                if (nota === null || nota === undefined) return '-';
                const num = parseFloat(nota);
                if (isNaN(num)) return '-';
                return num % 1 === 0 ? num.toString() : num.toFixed(1);
            },

            validarNota: (valor) => {
                const num = parseFloat(valor);
                if (isNaN(num)) return 0;
                
                if (num === 2 || num === 2.5) {
                    return num;
                }
                
                return 0;
            },

            obterCorMedia: (media) => {
                const num = parseFloat(media);
                if (isNaN(num)) return 'text-gray-500';
                
                if (num >= 9) return 'text-red-700 font-bold';
                if (num >= 7.5) return 'text-red-600 font-semibold';
                if (num >= 6) return 'text-red-500 font-semibold';
                if (num >= 4) return 'text-red-400';
                return 'text-red-300';
            },

            obterCorFundoMedia: (media) => {
                const num = parseFloat(media);
                if (isNaN(num)) return 'bg-gray-100';
                
                if (num >= 9) return 'bg-red-50';
                if (num >= 7.5) return 'bg-red-100';
                if (num >= 6) return 'bg-red-200';
                if (num >= 4) return 'bg-red-300';
                return 'bg-red-400';
            },

            calcularMediaGeral: (medias) => {
                if (!medias || !Array.isArray(medias)) return 0;
                const soma = medias.reduce((acc, val) => acc + (parseFloat(val) || 0), 0);
                return medias.length > 0 ? (soma / medias.length).toFixed(1) : 0;
            }
        };

        // ==================== GERENCIADOR DE API ====================
        const ApiManager = {
            jsonpCallbackId: 0,
            chamadasAPI: 0,
            tempoTotalAPI: 0,

            requestJSONP: (url, callback) => {
                const callbackName = 'jsonp_callback_' + ApiManager.jsonpCallbackId++;
                const inicio = performance.now();
                
                const timeout = setTimeout(() => {
                    if (window[callbackName]) {
                        delete window[callbackName];
                        callback(new Error('Timeout: A requisição demorou muito para responder'));
                    }
                }, 15000);
                
                window[callbackName] = function(data) {
                    const fim = performance.now();
                    const tempo = fim - inicio;
                    
                    clearTimeout(timeout);
                    delete window[callbackName];
                    if (script.parentNode) {
                        document.body.removeChild(script);
                    }
                    
                    ApiManager.chamadasAPI++;
                    ApiManager.tempoTotalAPI += tempo;
                    STATE.metricasPerformance.chamadasAPI = ApiManager.chamadasAPI;
                    STATE.metricasPerformance.tempoTotal = ApiManager.tempoTotalAPI;
                    
                    callback(null, data);
                };
                
                const script = document.createElement('script');
                script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
                script.onerror = function() {
                    const fim = performance.now();
                    const tempo = fim - inicio;
                    
                    clearTimeout(timeout);
                    delete window[callbackName];
                    if (script.parentNode) {
                        document.body.removeChild(script);
                    }
                    
                    ApiManager.chamadasAPI++;
                    ApiManager.tempoTotalAPI += tempo;
                    STATE.metricasPerformance.chamadasAPI = ApiManager.chamadasAPI;
                    STATE.metricasPerformance.tempoTotal = ApiManager.tempoTotalAPI;
                    
                    callback(new Error('Falha ao carregar o script. Verifique sua conexão.'));
                };
                
                document.body.appendChild(script);
            },

            get: async (func, params = {}, forceRefresh = false) => {
                const cacheKey = `api_${func}_${JSON.stringify(params)}`;
                
                if (!forceRefresh) {
                    const cached = CacheManager.get(cacheKey);
                    if (cached) {
                        return cached;
                    }
                }
                
                return new Promise((resolve, reject) => {
                    let url = `${CONFIG.API_URL}?`;
                    
                    if (func) {
                        url += `func=${func}`;
                    }
                    
                    for (const key in params) {
                        if (params[key] !== undefined && params[key] !== null) {
                            url += `&${key}=${encodeURIComponent(params[key])}`;
                        }
                    }
                    
                    if (forceRefresh) {
                        url += `&_=${Date.now()}`;
                    }
                    
                    console.log('Fazendo requisição para:', url.replace(/(email|senha)=[^&]*/g, '$1=***'));
                    
                    ApiManager.requestJSONP(url, (error, data) => {
                        if (error) {
                            reject(error);
                        } else if (data && data.success === false) {
                            reject(new Error(data.error));
                        } else {
                            CacheManager.set(cacheKey, data, 2 * 60 * 1000);
                            resolve(data);
                        }
                    });
                });
            },

            post: async (action, dados) => {
                return new Promise((resolve, reject) => {
                    let url = `${CONFIG.API_URL}?action=${action}`;
                    
                    for (const key in dados) {
                        if (dados[key] !== undefined && dados[key] !== null) {
                            if (Array.isArray(dados[key])) {
                                url += `&${key}=${encodeURIComponent(JSON.stringify(dados[key]))}`;
                            } else {
                                url += `&${key}=${encodeURIComponent(dados[key])}`;
                            }
                        }
                    }
                    
                    console.log('Fazendo POST para:', url.replace(/(email|senha)=[^&]*/g, '$1=***'));
                    
                    ApiManager.requestJSONP(url, (error, data) => {
                        if (error) {
                            reject(error);
                        } else if (data && data.success === false) {
                            reject(new Error(data.error));
                        } else {
                            resolve(data);
                        }
                    });
                });
            },

            getMetricas: () => {
                return {
                    chamadasAPI: ApiManager.chamadasAPI,
                    tempoTotalAPI: ApiManager.tempoTotalAPI,
                    tempoMedioAPI: ApiManager.chamadasAPI > 0 ? ApiManager.tempoTotalAPI / ApiManager.chamadasAPI : 0
                };
            },

            resetMetricas: () => {
                ApiManager.chamadasAPI = 0;
                ApiManager.tempoTotalAPI = 0;
                STATE.metricasPerformance.chamadasAPI = 0;
                STATE.metricasPerformance.tempoTotal = 0;
            }
        };

        const apiGet = ApiManager.get;
        const apiPost = ApiManager.post;

        // ==================== GERENCIADOR DE INTERFACE ====================
        const UIManager = {
            elements: {
                contentArea: document.getElementById('content-area'),
                userInfo: document.getElementById('user-info'),
                logoutBtn: document.getElementById('logoutBtn'),
                relatorioBtn: document.getElementById('relatorioBtn'),
                diagnosticoBtn: document.getElementById('diagnosticoBtn'),
                tarefasBtn: document.getElementById('tarefasBtn'),
                graficosBtn: document.getElementById('graficosBtn'),
                modalOverlay: document.getElementById('modal-overlay'),
                modalTitle: document.getElementById('modal-title'),
                modalMessage: document.getElementById('modal-message')
            },

            showModal: (title, message) => {
                UIManager.elements.modalTitle.textContent = title;
                UIManager.elements.modalMessage.textContent = message;
                UIManager.elements.modalOverlay.classList.remove('hidden');
            },

            closeModal: () => {
                UIManager.elements.modalOverlay.classList.add('hidden');
            },

            renderLoading: (message = 'Carregando...') => {
                return `
                    <div class="text-center py-8">
                        <div class="spinner"></div>
                        <p class="mt-4 text-gray-600">${message}</p>
                    </div>
                `;
            },

            renderError: (message) => {
                return `
                    <div class="text-center py-8">
                        <p class="text-red-500 mb-4">${Utils.escapeHTML(message)}</p>
                        <button onclick="location.reload()" class="btn-primario">Tentar Novamente</button>
                    </div>
                `;
            }
        };

        // ==================== SISTEMA DE AUTENTICAÇÃO ====================
        const AuthManager = {
            async login(credenciais) {
                const { email, senha } = credenciais;
                
                console.log('Tentando login com:', { email, senha: '***' });

                try {
                    const response = await apiPost('login', { email, senha });
                    
                    if (response.success && response.user) {
                        console.log('Usuário logado com sucesso:', response.user.NomeCompleto);
                        return response.user;
                    } else {
                        throw new Error('Credenciais inválidas');
                    }
                } catch (error) {
                    console.error('Erro no login:', error);
                    throw new Error('Erro ao fazer login. Verifique suas credenciais.');
                }
            },

            logout() {
                STATE.usuarioLogado = null;
                STATE.tarefaEditando = null;
                STATE.relatorioAlunoVisivel = false;
                UIManager.elements.logoutBtn.classList.add('hidden');
                UIManager.elements.relatorioBtn.classList.add('hidden');
                UIManager.elements.diagnosticoBtn.classList.add('hidden');
                UIManager.elements.tarefasBtn.classList.add('hidden');
                UIManager.elements.graficosBtn.classList.add('hidden');
                UIManager.elements.userInfo.innerHTML = '';
                STATE.contadoresAtivos.forEach(interval => clearInterval(interval));
                STATE.contadoresAtivos = [];
                CacheManager.clear();
                renderLogin();
            },

            updateUserInfo() {
                if (!STATE.usuarioLogado) return;
                
                const user = STATE.usuarioLogado;
                if (user.Perfil === "Professor") {
                    UIManager.elements.userInfo.innerHTML = `
                        <div class="user-info-text">
                            Logado como: <span class="font-semibold text-red-700">${Utils.escapeHTML(user.NomeCompleto)} (${user.Perfil})</span>
                        </div>
                    `;
                    UIManager.elements.relatorioBtn.onclick = mostrarRelatorioProfessor;
                    UIManager.elements.relatorioBtn.classList.remove('hidden');
                    UIManager.elements.diagnosticoBtn.classList.remove('hidden');
                    UIManager.elements.diagnosticoBtn.onclick = mostrarPainelDiagnostico;
                    UIManager.elements.tarefasBtn.classList.remove('hidden');
                    UIManager.elements.tarefasBtn.onclick = mostrarPainelProfessor;
                    UIManager.elements.graficosBtn.classList.remove('hidden');
                    UIManager.elements.graficosBtn.onclick = mostrarPainelGraficos;
                } else {
                    UIManager.elements.userInfo.innerHTML = `
                        <div class="user-info-text">
                            Logado como: <span class="font-semibold text-red-700">${Utils.escapeHTML(user.NomeCompleto)} (${user.Perfil})</span> | 
                            Turma: ${Utils.escapeHTML(user.Turma || 'N/A')} | 
                            Nº: ${Utils.escapeHTML(user.Numero || 'N/A')} |
                            Email: ${Utils.escapeHTML(user.Email || 'N/A')}
                        </div>
                    `;
                    UIManager.elements.relatorioBtn.classList.add('hidden');
                    UIManager.elements.diagnosticoBtn.classList.add('hidden');
                    UIManager.elements.tarefasBtn.classList.add('hidden');
                    // Removido o botão de gráficos para aluno
                    UIManager.elements.graficosBtn.classList.add('hidden');
                }
                
                UIManager.elements.logoutBtn.classList.remove('hidden');
            }
        };

        // ==================== SISTEMA DE TEMPO E PRAZOS ====================
        const TimeManager = {
            calcularStatusParteDiaUnico(dataAula, diasOffset) {
                const agora = new Date();
                const base = new Date(dataAula);

                if (isNaN(base.getTime())) {
                    return {
                        texto: 'Data inválida',
                        classe: 'aguardando',
                        liberada: false,
                        expirado: false,
                        dentroHorarioEntrega: false,
                        conteudoLiberado: false
                    };
                }

                base.setHours(0, 0, 0, 0);
                const diaEntrega = new Date(base);
                diaEntrega.setDate(diaEntrega.getDate() + diasOffset);

                const inicio = new Date(diaEntrega);
                inicio.setHours(7, 0, 0, 0);

                const fim = new Date(diaEntrega);
                fim.setHours(22, 0, 0, 0);

                const conteudoLiberado = agora >= inicio;

                if (agora < inicio) {
                    const diff = inicio - agora;
                    const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const horas = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                    let texto = '';
                    if (dias > 0) {
                        texto = `Libera em ${dias}d ${horas}h ${minutos}m`;
                    } else if (horas > 0) {
                        texto = `Libera em ${horas}h ${minutos}m`;
                    } else {
                        texto = `Libera em ${minutos}m`;
                    }

                    return {
                        texto,
                        classe: 'aguardando',
                        liberada: false,
                        expirado: false,
                        dentroHorarioEntrega: false,
                        conteudoLiberado: conteudoLiberado
                    };
                }

                if (agora > fim) {
                    return {
                        texto: 'Expirado',
                        classe: 'expirado',
                        liberada: false,
                        expirado: true,
                        dentroHorarioEntrega: false,
                        conteudoLiberado: conteudoLiberado
                    };
                }

                const diffFim = fim - agora;
                const diasFim = Math.floor(diffFim / (1000 * 60 * 60 * 24));
                const horasFim = Math.floor((diffFim % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutosFim = Math.floor((diffFim % (1000 * 60 * 60)) / (1000 * 60));
                
                let texto = '';
                if (diasFim > 0) {
                    texto = `Termina em ${diasFim}d ${horasFim}h ${minutosFim}m`;
                } else if (horasFim > 0) {
                    texto = `Termina em ${horasFim}h ${minutosFim}m`;
                } else {
                    texto = `Termina em ${minutosFim}m`;
                }

                return {
                    texto,
                    classe: 'disponivel',
                    liberada: true,
                    expirado: false,
                    dentroHorarioEntrega: true,
                    conteudoLiberado: conteudoLiberado
                };

            calcularContadoresOtimizado(dataAula) {
                return {

                    parte3: TimeManager.calcularStatusParteDiaUnico(dataAula, 14),

                };
            },

            iniciarAtualizacaoContadores() {
                STATE.contadoresAtivos.forEach(interval => clearInterval(interval));
                STATE.contadoresAtivos = [];
                
                const interval = setInterval(() => {
                    if (STATE.usuarioLogado && STATE.usuarioLogado.Perfil === 'Aluno') {

                    }

        async function handleLogin(event) {
            event.preventDefault();
            const emailPrefix = document.getElementById('email-prefix').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            
            const loginErro = document.getElementById('loginErro');
            const loginButton = document.getElementById('login-button');
            const loginText = document.getElementById('login-text');
            
            if (!emailPrefix) {
                loginErro.textContent = 'Por favor, insira seu nome e sobrenome.';
                loginErro.style.display = 'block';
                return;
            }

            Utils.setButtonLoading(loginButton, true);
            loginText.textContent = "Entrando...";
            loginErro.style.display = 'none';
            
            try {
                console.log('Tentando login com:', { email, senha: '***' });
                
                const response = await apiPost('login', { email, senha });
                
                if (response.success && response.data && response.data.success) {
                    STATE.usuarioLogado = response.data.user;
                    loginErro.style.display = 'none';
                    
                    UIManager.elements.contentArea.innerHTML = UIManager.renderLoading('Carregando painel...');
                    
                    try {
                        const tarefasResponse = await apiGet('getTarefas', {}, true);
                        STATE.tarefas = tarefasResponse.data || tarefasResponse;

                    } else {
                        await mostrarPainelAluno();
                    }
                } else {
                    throw new Error(response.data?.error || response.error || 'Erro desconhecido no login');
                }
                
            } catch (error) {
                console.error('Erro no login:', error);
                loginErro.textContent = error.message;
                loginErro.style.display = 'block';
            } finally {
                Utils.setButtonLoading(loginButton, false);
                loginText.textContent = "Entrar";
            }
        }

        async function salvarTarefaUnificada() {
            const btnSalvar = document.getElementById('btnSalvarTarefa');
            
            try {
                Utils.setButtonLoading(btnSalvar, true);
                
                let turmasSelecionadas;
                
                if (STATE.tarefaEditando) {
                    turmasSelecionadas = [STATE.tarefaEditando.Turma];
                } else {
                    turmasSelecionadas = Array.from(document.querySelectorAll('.turma-checkbox:checked'))
                        .map(cb => cb.value);
                    
                    if (turmasSelecionadas.length === 0) {
                        UIManager.showModal('Atenção', 'Selecione pelo menos uma turma.');
                        return;
                    }
                }

                const periodo = document.getElementById('periodo').value;
                if (!periodo) {
                    UIManager.showModal('Atenção', 'Selecione o período da tarefa.');
                    return;
                }

                const tema = document.getElementById('tema').value.trim();
                const dataAula = document.getElementById('dataAula').value;

                if (!tema || !dataAula) {
                    UIManager.showModal('Atenção', 'Preencha o tema e a data da aula.');
                    return;
                }

                if (tema.length > CONFIG.MAX_TEMA_LEN) {
                    UIManager.showModal('Atenção', `O tema deve ter no máximo ${CONFIG.MAX_TEMA_LEN} caracteres.`);
                    return;
                }

                const parte1 = document.getElementById('parte1').value.trim();
                const parte2 = document.getElementById('parte2').value.trim();
                const parte3 = document.getElementById('parte3').value.trim();
                const parte4 = document.getElementById('parte4').value.trim();

                if (!parte1 || !parte2 || !parte3 || !parte4) {
                    UIManager.showModal('Atenção', 'Todas as partes da tarefa devem ser preenchidas.');
                    return;
                }

                if ([parte1, parte2, parte3, parte4].some(p => p.length > CONFIG.MAX_PARTE_LEN)) {
                    UIManager.showModal('Atenção', `Cada parte deve ter no máximo ${CONFIG.MAX_PARTE_LEN} caracteres.`);
                    return;
                }

                console.log('Iniciando criação/atualização de tarefas para turmas:', turmasSelecionadas, 'período:', periodo);
                
                let results;
                if (STATE.tarefaEditando) {
                    const dados = {
                        ID: STATE.tarefaEditando.ID,
                        Turma: STATE.tarefaEditando.Turma,
                        Periodo: periodo,
                        Tema: tema,
                        Parte1: parte1,
                        Parte2: parte2,
                        Parte3: parte3,
                        Parte4: parte4,
                        DataAula: dataAula,
                        professor: STATE.usuarioLogado.NomeCompleto
                    };

                    console.log(`Enviando dados para edição da tarefa ${STATE.tarefaEditando.ID}:`, dados);
                    results = [await apiPost('editarTarefa', dados)];
                } else {
                    const promises = turmasSelecionadas.map(async (turma) => {
                        const dados = {
                            Turma: turma,
                            Periodo: periodo,
                            Tema: tema,
                            Parte1: parte1,
                            Parte2: parte2,
                            Parte3: parte3,
                            Parte4: parte4,
                            DataAula: dataAula,
                            professor: STATE.usuarioLogado.NomeCompleto
                        };

                        console.log(`Enviando dados para turma ${turma}, período ${periodo}:`, dados);
                        return await apiPost('criarTarefaUnificada', dados);
                    });

                    results = await Promise.all(promises);
                }
                
                console.log('Resultados da criação/edição:', results);
                
                const erros = results.filter(r => !r.success);
                if (erros.length > 0) {
                    throw new Error(`Erro em ${erros.length} turma(s): ${erros.map(e => e.error || 'Erro desconhecido').join(', ')}`);
                }
                
                const periodoNome = CONFIG.PERIODOS[periodo] || `Período ${periodo}`;
                UIManager.showModal('Sucesso', `Tarefa ${STATE.tarefaEditando ? 'atualizada' : 'criada'} com sucesso para as turmas: ${turmasSelecionadas.join(', ')} no ${periodoNome}!`);
                
                CacheManager.remove('painel_professor');
                CacheManager.remove('tarefas_professor_lista');
                turmasSelecionadas.forEach(turma => {
                    CacheManager.remove(`relatorio_${turma}`);
                    CacheManager.remove(`graficos_${turma}`);
                });
                
                limparFormulario();
                await carregarTarefasProfessor();
                
            } catch (error) {
                console.error('Erro detalhado ao criar/editar tarefa:', error);
                UIManager.showModal('Erro', `Erro ao ${STATE.tarefaEditando ? 'editar' : 'criar'} tarefa: ${error.message}`);
            } finally {
                Utils.setButtonLoading(btnSalvar, false);
            }
        }

        async function excluirTarefaDireto(idTarefa, botao) {
            if (botao.getAttribute('data-confirmando') === 'true') {
                console.log('Iniciando exclusão confirmada da tarefa:', idTarefa);
                
                const tarefa = STATE.tarefas.find(t => t.ID === idTarefa);
                if (!tarefa) {
                    UIManager.showModal('Erro', 'Tarefa não encontrada.');
                    return;
                }
                
                Utils.setButtonLoading(botao, true);
                
                try {
                    const response = await apiPost('excluirTarefa', { ID: idTarefa });
                    
                    if (response.success) {
                        const periodoNome = CONFIG.PERIODOS[tarefa.Periodo] || `Período ${tarefa.Periodo}`;
                        UIManager.showModal('Sucesso', `Tarefa "${tarefa.Tema}" do ${periodoNome} excluída com sucesso!`);
                        
                        CacheManager.remove('painel_professor');
                        CacheManager.remove('tarefas_professor_lista');
                        CONFIG.TURMAS.forEach(turma => {
                            CacheManager.remove(`relatorio_${turma}`);
                            CacheManager.remove(`graficos_${turma}`);
                        });
                        
                        await carregarTarefasProfessor();
                        
                    } else {
                        throw new Error(response.error || 'Erro desconhecido ao excluir tarefa');
                    }
                    
                } catch (error) {
                    console.error('Erro ao excluir tarefa:', error);
                    UIManager.showModal('Erro', `Falha ao excluir tarefa: ${error.message}`);
                } finally {
                    Utils.setButtonLoading(botao, false);
                }
            } else {
                const textoOriginal = botao.textContent;
                botao.setAttribute('data-confirmando', 'true');
                botao.textContent = 'Clique novamente para excluir';
                botao.style.backgroundColor = '#dc2626';
                
                setTimeout(() => {
                    if (botao.getAttribute('data-confirmando') === 'true') {
                        botao.setAttribute('data-confirmando', 'false');
                        botao.textContent = textoOriginal;
                        botao.style.backgroundColor = '';
                    }
                }, 3000);
            }
        }

        async function editarTarefa(idTarefa) {
            const tarefa = STATE.tarefas.find(t => t.ID === idTarefa);
            if (!tarefa) {
                UIManager.showModal('Erro', 'Tarefa não encontrada.');
                return;
            }

            const container = document.getElementById('tarefas-aluno-container');
            if (!container) {
                console.error('Container de tarefas do aluno não encontrado');
                return;
            }

            mostrarLoadingTarefasAluno();
            
            try {
                console.log('Carregando tarefas para aluno:', STATE.usuarioLogado.Email, 'Turma:', STATE.usuarioLogado.Turma);
                
                // Buscar tarefas da turma do aluno
                const response = await apiGet('getTarefasPorTurma', { turma: STATE.usuarioLogado.Turma }, true);
                console.log('Resposta da API getTarefasPorTurma:', response);
                
                if (!response.data || response.data.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">Nenhuma tarefa disponível para sua turma.</div>';
                    return;
                }

                // Agrupar tarefas por período
                const tarefasPorPeriodo = {};
                response.data.forEach(tarefa => {
                    if (!tarefasPorPeriodo[tarefa.Periodo]) {
                        tarefasPorPeriodo[tarefa.Periodo] = [];
                    }
                    tarefasPorPeriodo[tarefa.Periodo].push(tarefa);
                });

                // Buscar dados completos do aluno
                let alunoData = null;
                let entregas = [];
                
                try {
                    const alunoResponse = await apiGet('getDadosAlunoCompleto', { 
                        email: STATE.usuarioLogado.Email, 
                        turma: STATE.usuarioLogado.Turma 
                    }, true);
                    
                    if (alunoResponse.success) {
                        alunoData = alunoResponse.data;
                        entregas = extrairEntregasDeAlunoData(alunoResponse.data, response.data);
                    }
                } catch (error) {
                    console.warn('Erro ao buscar dados do aluno, usando dados básicos:', error);
                }

                console.log('Tarefas carregadas:', response.data.length);
                console.log('Entregas encontradas:', entregas.length);
                
                // Renderizar tarefas agrupadas por período
                renderTarefasAlunoAgrupadasPorPeriodo(tarefasPorPeriodo, entregas, alunoData, container);
                
            } catch (error) {
                console.error('Erro detalhado ao carregar tarefas do aluno:', error);
                container.innerHTML = 
                    `<div class="text-center text-red-500 py-8">
                        <p>Erro ao carregar tarefas: ${Utils.escapeHTML(error.message || String(error))}</p>

                return;
            }

            let html = '';
            
            // Ordenar períodos
            const periodosOrdenados = Object.keys(tarefasPorPeriodo).sort((a, b) => a - b);
            
            periodosOrdenados.forEach(periodoNum => {
                const periodoNome = CONFIG.PERIODOS[periodoNum] || `Período ${periodoNum}`;
                const tarefasPeriodo = tarefasPorPeriodo[periodoNum];
                
                html += `

                    // Buscar nota total da tarefa

                    if (alunoData) {

                            notaTotal = parseFloat(alunoData[chaveNotaTarefa]) || 0;

                            ${renderParteAlunoComNotaCorreta(tarefa, 2, entregaTarefa, index, alunoData, periodoNum)}
                            ${renderParteAlunoComNotaCorreta(tarefa, 3, entregaTarefa, index, alunoData, periodoNum)}
                            ${renderParteAlunoComNotaCorreta(tarefa, 4, entregaTarefa, index, alunoData, periodoNum)}

                    </div>

                });
                
                html += `</div>`;

            container.innerHTML = html;

        function extrairEntregasDeAlunoData(alunoData, tarefas) {
            const entregas = [];
            
            if (!alunoData || !tarefas) return entregas;
            
            tarefas.forEach((tarefa, tarefaIndex) => {
                for (let parte = 1; parte <= 4; parte++) {
                    const parteGlobal = (tarefaIndex * 4) + parte;
                    const chavesLink = [
                        `Link${parteGlobal}_P${tarefa.Periodo}`,
                        `P${parte}_T${tarefaIndex + 1}_P${tarefa.Periodo}`,
                        `Parte${parteGlobal}_P${tarefa.Periodo}`
                    ];
                    
                    const chavesData = [
                        `DataHora${parteGlobal}_P${tarefa.Periodo}`,
                        `Data${parteGlobal}_P${tarefa.Periodo}`
                    ];
                    
                    const chavesNota = [
                        `Parte${parteGlobal}_P${tarefa.Periodo}`,
                        `NotaParte${parteGlobal}_P${tarefa.Periodo}`,
                        `P${parte}_T${tarefaIndex + 1}_P${tarefa.Periodo}`,
                        `Parte${parte}_T${tarefaIndex + 1}_P${tarefa.Periodo}`
                    ];
                    
                    let link = '';
                    let dataHora = '';
                    let nota = 0;
                    
                    for (const chave of chavesLink) {
                        if (alunoData[chave] !== undefined && alunoData[chave] !== null && alunoData[chave] !== '') {
                            link = alunoData[chave];
                            break;
                        }
                    }
                    
                    for (const chave of chavesData) {
                        if (alunoData[chave] !== undefined && alunoData[chave] !== null && alunoData[chave] !== '') {
                            dataHora = alunoData[chave];
                            break;
                        }
                    }
                    
                    for (const chave of chavesNota) {
                        if (alunoData[chave] !== undefined && alunoData[chave] !== null && alunoData[chave] !== '') {
                            nota = parseFloat(alunoData[chave]) || 0;
                            break;
                        }
                    }
                    
                    // Validar nota
                    nota = Utils.validarNota(nota);
                    
                    if (link && link.toString().trim() !== '') {
                        entregas.push({
                            ID_Tarefa: tarefa.ID,
                            Periodo: tarefa.Periodo,
                            Parte: parte,
                            Link: link.toString().trim(),
                            DataSubmissao: dataHora,
                            Nota: nota
                        });
                    }
                }
            });
            
            return entregas;
        }

        async function salvarLinkAluno(idTarefa, parte, botaoSalvar) {
            const input = document.getElementById(`link-${idTarefa}-${parte}`);
            let link = input ? input.value.trim() : '';
            
            if (!link) {
                UIManager.showModal('Atenção', 'Por favor, cole um link válido.');
                return;
            }

            if (!Utils.validarLink(link)) {
                UIManager.showModal('Atenção', 'Link inválido. Certifique-se de que é um link válido (ex: https://exemplo.com).');
                return;
            }

            if (!/^https?:\/\//i.test(link)) {
                link = 'https://' + link;
            }

            try {
                Utils.setButtonLoading(botaoSalvar, true);
                botaoSalvar.textContent = "Salvando...";
                
                console.log('Enviando link para salvar:', {
                    ID_Tarefa: idTarefa,
                    Email_Aluno: STATE.usuarioLogado.Email,
                    Turma: STATE.usuarioLogado.Turma,
                    Parte: parte,
                    Link: link
                });
                
                const response = await apiPost('entregarTarefa', {
                    ID_Tarefa: idTarefa,
                    Email_Aluno: STATE.usuarioLogado.Email,
                    NomeAluno: STATE.usuarioLogado.NomeCompleto,

        function atualizarContadoresAluno() {
            const containers = document.querySelectorAll('#tarefas-aluno-container > div');
            
            containers.forEach(container => {
                const periodoHeaders = container.querySelectorAll('h4');
                if (!periodoHeaders) return;
                
                // Atualizar contadores para cada tarefa dentro do período
                const tarefaContainers = container.querySelectorAll('.tarefa-aluno-container');
                tarefaContainers.forEach(tarefaContainer => {
                    const tema = tarefaContainer.querySelector('h5')?.textContent;
                    if (!tema) return;
                    
                    const tarefa = STATE.tarefas.find(t => t.Tema === tema);
                    if (tarefa) {
                        const contadores = TimeManager.calcularContadoresOtimizado(tarefa.DataAula);
                        
                        [1, 2, 3, 4].forEach(parte => {
                            const contadorElement = tarefaContainer.querySelector(`#parte-${tarefa.ID}-${parte} .contador`);
                            if (contadorElement) {
                                const contador = contadores[`parte${parte}`];
                                if (contadorElement.textContent !== contador.texto) {
                                    contadorElement.textContent = contador.texto;
                                    contadorElement.className = `contador ${contador.classe}`;
                                }
                            }
                        });
                    }
                });
            });
        }

        function renderGraficoDistribuicaoNotas(dados) {
            const ctx = document.getElementById('graficoDistribuicaoNotas').getContext('2d');
            
            // Calcular distribuição para o último período
            const ultimoPeriodo = dados.dadosPeriodos[dados.dadosPeriodos.length - 1];
            const distribuicao = [0, 0, 0, 0]; // 0-4, 4-6, 6-8, 8-10
            
            ultimoPeriodo.medias.forEach(media => {
                if (media >= 8) {
                    distribuicao[3]++;
                } else if (media >= 6) {
                    distribuicao[2]++;
                } else if (media >= 4) {
                    distribuicao[1]++;
                } else if (media > 0) {
                    distribuicao[0]++;
                }
            });
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['0-4', '4-6', '6-8', '8-10'],
                    datasets: [{
                        data: distribuicao,
                        backgroundColor: [
                            'rgba(239, 68, 68, 0.7)',
                            'rgba(185, 28, 28, 0.7)',
                            'rgba(153, 27, 27, 0.7)',
                            'rgba(127, 29, 29, 0.7)'
                        ],
                        borderColor: [
                            'rgb(239, 68, 68)',
                            'rgb(185, 28, 28)',
                            'rgb(153, 27, 27)',
                            'rgb(127, 29, 29)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: `Distribuição de Notas - ${ultimoPeriodo.nomePeriodo}`
                        }
                    }
                }
            });
        }

                            relatorioTurmaHTML += `
                                <tr>
                                    <td class="px-4 py-3 text-center border-b">${aluno.Numero || ''}</td>
                                    <td class="px-4 py-3 font-medium text-gray-900 border-b">${Utils.escapeHTML(aluno.NomeCompleto)}</td>
                            `;
                            
                            // Médias dos períodos
                            medias.forEach(media => {
                                relatorioTurmaHTML += `
                                    <td class="px-1 py-3 text-center border-b">
                                        <span class="${Utils.obterCorMedia(media)} font-semibold">
                                            ${Utils.formatarNota(media)}
                                        </span>
                                    </td>
                                `;
                            });
                            
                            // Notas das tarefas por período
                            periodosComTarefas.forEach(periodoNum => {
                                const tarefasPeriodo = tarefasPorPeriodo[periodoNum];
                                
                                tarefasPeriodo.forEach((tarefa, tarefaIndex) => {
                                    for (let parte = 1; parte <= 4; parte++) {
                                        const chaveNota = `P${parte}_T${tarefaIndex + 1}_P${periodoNum}`;
                                        let notaParte = parseFloat(aluno[chaveNota]) || 0;
                                        notaParte = Utils.validarNota(notaParte);
                                        
                                        relatorioTurmaHTML += `
                                            <td class="px-1 py-3 text-center border-b">
                                                <span class="text-gray-600">
                                                    ${notaParte > 0 ? Utils.formatarNota(notaParte) : '-'}
                                                </span>
                                            </td>
                                        `;
                                    }
                                });
                            });
                            
                            relatorioTurmaHTML += `</tr>`;
                        });
                        
                        relatorioTurmaHTML += `
                                </tbody>
                            </table>
                        </div>
                    `;
                    }
                }
                
                document.getElementById('relatorio-turma-container').innerHTML = relatorioTurmaHTML;
                
            } catch (error) {
                console.error('Erro ao carregar relatório:', error);
                document.getElementById('relatorio-turma-container').innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-red-500">Erro ao carregar relatório: ${Utils.escapeHTML(error.message || String(error))}</p>
                        <button onclick="carregarRelatorioTurma('${turma}')" class="btn-secundario mt-4">
                            Tentar Novamente
                        </button>
                    </div>
                `;
            }
        }

        function exportarParaExcel(turma) {
            if (!turma) {
                UIManager.showModal('Atenção', 'Selecione uma turma primeiro.');
                return;
            }
            
            try {
                const table = document.getElementById('tabela-relatorio');
                if (!table) {
                    UIManager.showModal('Erro', 'Tabela não encontrada para exportação.');
                    return;
                }

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.table_to_sheet(table);
                XLSX.utils.book_append_sheet(wb, ws, `Turma ${turma}`);
                XLSX.writeFile(wb, `relatorio_turma_${turma}.xlsx`);
            } catch (error) {
                UIManager.showModal('Erro', `Erro ao exportar para Excel: ${error.message}`);
            }
        }

        function exportarParaPDF(turma) {
            if (!turma) {
                UIManager.showModal('Atenção', 'Selecione uma turma primeiro.');
                return;
            }
            
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFontSize(16);
                doc.text(`Relatório da Turma ${turma}`, 14, 15);

                doc.setFontSize(10);
                doc.text(`Emitido em: ${new Date().toLocaleDateString()}`, 14, 22);

                const table = document.getElementById('tabela-relatorio');
                doc.autoTable({
                    html: table,
                    startY: 30,
                    styles: { fontSize: 7 },
                    headStyles: { fillColor: [204, 0, 0] }
                });

                doc.save(`relatorio_turma_${turma}.pdf`);
            } catch (error) {
                UIManager.showModal('Erro', `Erro ao exportar para PDF: ${error.message}`);
            }
        }

        // ==================== PAINEL DE DIAGNÓSTICO ====================

                            </div>

                    </div>

                            Testar Validação de Link
                        </button>
                    </div>

                    <div class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                        <h4 class="font-semibold text-red-800 mb-2">Limpeza de Cache</h4>
                        <button onclick="limparCacheCompleto()" class="btn-primario text-sm" style="background-color: #dc2626;">
                            Limpar Todo o Cache
                        </button>

            `;

        function carregarStatusCache() {
            const container = document.getElementById('status-cache');
            
            try {
                const cacheStats = CacheManager.getCacheStats();
                
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Itens em Cache:</span>
                            <span class="font-semibold">${cacheStats.itens}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Tamanho do Cache:</span>
                            <span class="font-semibold">${Utils.formatarBytes(cacheStats.tamanho)}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Eficiência:</span>
                            <span class="font-semibold ${cacheStats.eficiencia > 80 ? 'text-green-600' : cacheStats.eficiencia > 50 ? 'text-yellow-600' : 'text-red-600'}">
                                ${cacheStats.eficiencia.toFixed(1)}%
                            </span>
                        </div>
                    </div>
                    <button onclick="limparCache()" class="btn-primario w-full mt-4" style="background-color: #ef4444;">
                        Limpar Cache
                    </button>
                `;
            } catch (error) {
                container.innerHTML = `<p class="text-red-500 text-sm">Erro ao carregar status do cache</p>`;
            }
        }

        function carregarEstatisticasSistema() {
            const container = document.getElementById('estatisticas-sistema');
            
            try {
                const usuariosCarregados = STATE.usuarioLogado ? 1 : 0;
                const tarefasCarregadas = STATE.tarefas.length;
                const metricasAPI = ApiManager.getMetricas();
                
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Usuário Logado:</span>
                            <span class="font-semibold">${usuariosCarregados}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Tarefas Carregadas:</span>
                            <span class="font-semibold">${tarefasCarregadas}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Chamadas API:</span>
                            <span class="font-semibold">${metricasAPI.chamadasAPI}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Tempo Total API:</span>
                            <span class="font-semibold">${metricasAPI.tempoTotalAPI.toFixed(0)} ms</span>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<p class="text-red-500 text-sm">Erro ao carregar estatísticas</p>`;
            }
        }

        function carregarMetricasPerformance() {
            const container = document.getElementById('metricas-performance');
            
            try {
                const metricasAPI = ApiManager.getMetricas();
                const memory = performance.memory;
                
                let metricsHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Tempo Médio API:</span>
                            <span class="font-semibold ${metricasAPI.tempoMedioAPI < 100 ? 'text-green-600' : metricasAPI.tempoMedioAPI < 500 ? 'text-yellow-600' : 'text-red-600'}">
                                ${metricasAPI.tempoMedioAPI.toFixed(2)} ms
                            </span>
                        </div>
                        
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Status API:</span>
                            <span class="font-semibold text-green-600">Online</span>
                        </div>
                `;
                
                if (memory) {
                    const memoriaUsadaMB = (memory.usedJSHeapSize / 1048576).toFixed(2);
                    const memoriaTotalMB = (memory.totalJSHeapSize / 1048576).toFixed(2);
                    const percentualMemoria = ((memory.usedJSHeapSize / memory.totalJSHeapSize) * 100).toFixed(1);
                    
                    metricsHTML += `
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Memória Usada:</span>
                            <span class="font-semibold ${percentualMemoria < 70 ? 'text-green-600' : percentualMemoria < 85 ? 'text-yellow-600' : 'text-red-600'}">
                                ${memoriaUsadaMB} MB
                            </span>
                        </div>
                        
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Memória Total:</span>
                            <span class="font-semibold">${memoriaTotalMB} MB</span>
                        </div>
                    `;
                } else {
                    metricsHTML += `
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">Memória:</span>
                            <span class="font-semibold text-gray-500">N/A</span>
                        </div>
                    `;
                }
                
                metricsHTML += `</div>`;
                
                container.innerHTML = metricsHTML;
                
            } catch (error) {
                container.innerHTML = `<p class="text-red-500 text-sm">Erro ao carregar métricas</p>`;
            }
        }

        window.testarValidacaoLink = function() {
            const linkTeste = prompt('Digite um link para testar a validação:');
            if (linkTeste) {
                const valido = Utils.validarLink(linkTeste);
                UIManager.showModal(
                    'Teste de Validação', 
                    `Link: ${linkTeste}\n\nResultado: ${valido ? 'VÁLIDO ✓' : 'INVÁLIDO ✗'}\n\n${valido ? 'Este link será aceito pelo sistema.' : 'Verifique se o link tem protocolo (http:// ou https://) e é um link válido.'}`
                );
            }
        };

        window.limparCache = function() {
            CacheManager.clear();
            UIManager.showModal('Sucesso', 'Cache limpo com sucesso!');
            setTimeout(() => {
                carregarStatusCache();
                carregarMetricasPerformance();
            }, 1000);
        };

        window.limparCacheCompleto = function() {
            if (confirm('Isso limpará TODO o cache do navegador para este site. Todas as informações salvas localmente serão perdidas. Continuar?')) {
                localStorage.clear();
                sessionStorage.clear();
                UIManager.showModal('Sucesso', 'Cache completamente limpo! A página será recarregada.');
                setTimeout(() => {
                    location.reload(true);
                }, 2000);
            }
        };
