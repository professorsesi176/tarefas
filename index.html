<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Tarefas Escolar</title>
    
    <!-- Otimizações de Performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://script.google.com">
    
    <!-- CSS externo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <!-- CSS Customizado -->
    <style>
        /* Variáveis CSS */
        :root {
            --cor-primaria: #CC0000;
            --cor-secundaria: #A00000;
            --cor-sucesso: #10b981;
            --cor-erro: #ef4444;
            --cor-aviso: #f59e0b;
        }
        
        /* Estilos principais */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f4f7f9;
            margin: 0;
            padding: 0;
        }
        
        .card { 
            background-color: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.2); 
        }
        
        .btn-primario { 
            background-color: var(--cor-primaria); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: all 0.2s; 
            cursor: pointer; 
            font-size: 14px;
            border: none;
        }
        
        .btn-primario:hover { 
            background-color: var(--cor-secundaria); 
            transform: translateY(-1px);
        }
        
        .btn-secundario { 
            background-color: #d1d5db; 
            color: #1e1e1e; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: background-color 0.2s; 
            cursor: pointer; 
            border: none;
        }
        
        .btn-secundario:hover { 
            background-color: #9ca3af; 
        }
        
        input, textarea, select {
            border: 1px solid #d1d5db; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            transition: border-color 0.2s; 
            margin-top: 4px; 
            margin-bottom: 8px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus { 
            border-color: var(--cor-primaria); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.1);
        }
        
        .hidden { 
            display: none; 
        }
        
        .spinner {
            border: 2px solid #f3f3f3;
            border-radius: 50%;
            border-top: 2px solid var(--cor-primaria);
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Componentes específicos */
        .email-container {
            display: flex;
            width: 100%;
        }
        
        .email-prefix {
            flex: 1;
        }
        
        .email-suffix {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            border-left: none;
            border-radius: 0 8px 8px 0;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            color: #6b7280;
            font-weight: 500;
        }
        
        .email-prefix input {
            border-radius: 8px 0 0 8px !important;
            border-right: none;
        }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        
        .turma-checkbox {
            width: 16px;
            height: 16px;
            accent-color: #CC0000;
            cursor: pointer;
            margin-right: 4px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 1rem;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .diagnostico-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .diagnostico-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            background-color: white;
        }
        
        .compact-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .compact-table th, 
        .compact-table td {
            padding: 12px 8px;
            border: 1px solid #e5e7eb;
        }
        
        .compact-table th {
            background-color: var(--cor-primaria);
            color: white;
            font-weight: 600;
        }
        
        .header-tarefa {
            background-color: #CC0000;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        
        .subheader-tarefa {
            background-color: #e53e3e;
            color: white;
            text-align: center;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .parte-column {
            width: 60px;
            text-align: center;
            font-size: 0.75rem;
        }
        
        .btn-loading {
            position: relative;
            color: transparent;
        }
        
        .btn-loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        
        .turmas-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .btn-turma-compact {
            padding: 8px 16px;
            border-radius: 6px;
            background-color: #f3f4f6;
            color: #4b5563;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-turma-compact:hover {
            background-color: #e5e7eb;
        }
        
        .btn-turma-compact.active {
            background-color: var(--cor-primaria);
            color: white;
        }
        
        .export-buttons-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .btn-exportar {
            padding: 8px 16px;
            border-radius: 6px;
            background-color: #10b981;
            color: white;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-exportar:hover {
            background-color: #059669;
        }
        
        .password-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .link-container {
            display: flex;
            gap: 8px;
        }
        
        .link-input {
            flex: 1;
        }
        
        .btn-link {
            padding: 8px 12px;
            white-space: nowrap;
        }
        
        .contador {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .contador.disponivel {
            background-color: #dcfce7;
            color: #166534;
        }
        
        .contador.expirado {
            background-color: #fef2f2;
            color: #991b1b;
        }
        
        .contador.aguardando {
            background-color: #fffbeb;
            color: #92400e;
        }
        
        .link-salvo {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }
        
        .conteudo-formatado {
            white-space: pre-wrap;
            line-height: 1.5;
        }
        
        .header-content {
            position: relative;
        }
        
        .user-info-container {
            margin-top: 8px;
        }
    </style>
</head>
<body class="min-h-screen flex items-start justify-center p-4 sm:p-8">
    <div id="app-container" class="w-full max-w-6xl bg-white shadow-xl rounded-2xl p-6 sm:p-8 transition-all duration-300">
        <header class="mb-8 border-b pb-4">
            <div class="header-content">
                <h1 class="text-3xl font-extrabold text-red-700 text-center">Sistema de Gestão de Tarefas</h1>
                <div id="user-info" class="user-info-container text-center mt-2 text-gray-600"></div>
                <div class="absolute top-0 right-0 flex space-x-2">
                    <button id="diagnosticoBtn" class="btn-primario hidden">Diagnóstico</button>
                    <button id="relatorioBtn" class="btn-primario hidden" style="background-color: #10b981;">Relatório</button>
                    <button onclick="logout()" id="logoutBtn" class="btn-secundario hidden">Sair</button>
                </div>
            </div>
        </header>

        <div id="content-area"></div>

        <footer class="mt-8 pt-4 border-t text-xs text-gray-500 text-center">
            Desenvolvido por Geovane Modena | Versão 20.4
        </footer>
    </div>

    <!-- Modal para mensagens -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title" class="text-xl font-bold mb-3 text-red-600"></h3>
            <p id="modal-message" class="text-gray-700 mb-4 whitespace-pre-wrap"></p>
            <button onclick="closeModal()" class="btn-primario w-full">OK</button>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-3 text-red-600">Confirmar Exclusão</h3>
            <p id="confirm-message" class="text-gray-700 mb-4"></p>
            <div class="flex space-x-4">
                <button id="confirm-cancel" class="btn-secundario flex-1">Cancelar</button>
                <button id="confirm-delete" class="btn-primario flex-1">Excluir</button>
            </div>
        </div>
    </div>

    <script>
    // ==================== CONFIGURAÇÃO E CONSTANTES ====================
    const CONFIG = {
        API_URL: "https://script.google.com/macros/s/AKfycbx3n_ZZobnfty_21WjCTJ5t4Yb0UblaNZ1TCGTi-NKbpPfQXlZAEm8Bb7oSLSyR5T_OUA/exec",
        CACHE_TTL: 5 * 60 * 1000, // 5 minutos
        MAX_TEMA_LEN: 200,
        MAX_PARTE_LEN: 4000,
        TURMAS: ["1A", "1B", "2A", "2B", "3A", "3B"],
        RATE_LIMIT_INFO: {
            login: "5 tentativas por minuto",
            criar_tarefa: "3 tarefas por minuto", 
            entregas: "10 entregas por minuto",
            relatorios: "5 relatórios por minuto",
            geral: "30 requisições por minuto"
        }
    };

    // ==================== ESTADO GLOBAL ====================
    const STATE = {
        usuarios: [],
        usuarioLogado: null,
        tarefas: [],
        tarefaEditando: null,
        tarefaParaExcluir: null,
        contadoresAtivos: [],
        jsonpCallbackId: 0,
        rmVisible: false,
        relatorioAlunoVisivel: false,
        performanceMetrics: {
            apiCalls: 0,
            cacheHits: 0,
            cacheMisses: 0,
            startTime: performance.now()
        }
    };

    // ==================== SISTEMA DE CACHE ====================
    const CacheManager = {
        get: (key) => {
            try {
                const item = localStorage.getItem(`task_${key}`);
                if (item) {
                    const { data, expiry } = JSON.parse(item);
                    if (Date.now() > expiry) {
                        localStorage.removeItem(`task_${key}`);
                        STATE.performanceMetrics.cacheMisses++;
                        return null;
                    }
                    STATE.performanceMetrics.cacheHits++;
                    return data;
                }
            } catch (e) {
                console.warn('Erro ao acessar cache:', e);
            }
            STATE.performanceMetrics.cacheMisses++;
            return null;
        },
        
        set: (key, data, ttl = CONFIG.CACHE_TTL) => {
            try {
                const item = {
                    data,
                    expiry: Date.now() + ttl
                };
                localStorage.setItem(`task_${key}`, JSON.stringify(item));
                return true;
            } catch (e) {
                console.warn('Erro ao salvar no cache:', e);
                return false;
            }
        },
        
        remove: (key) => {
            try {
                localStorage.removeItem(key.startsWith('task_') ? key : `task_${key}`);
            } catch (e) {
                console.warn('Erro ao remover do cache:', e);
            }
        },
        
        clear: () => {
            try {
                const keys = Object.keys(localStorage).filter(k => k.startsWith('task_'));
                keys.forEach(k => localStorage.removeItem(k));
            } catch (e) {
                console.warn('Erro ao limpar cache:', e);
            }
        }
    };

    // ==================== UTILITÁRIOS ====================
    const Utils = {
        debounce: (func, wait, immediate = false) => {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    timeout = null;
                    if (!immediate) func(...args);
                };
                const callNow = immediate && !timeout;
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
                if (callNow) func(...args);
            };
        },

        formatarData: (dataISO) => {
            if (!dataISO) return 'N/A';
            const data = new Date(dataISO);
            return isNaN(data.getTime()) ? 'N/A' : data.toLocaleDateString('pt-BR');
        },

        escapeHTML: (texto) => {
            if (!texto) return '';
            return String(texto)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        },

        setButtonLoading: (button, isLoading) => {
            if (!button) return;
            if (isLoading) {
                button.disabled = true;
                button.classList.add('btn-loading');
            } else {
                button.disabled = false;
                button.classList.remove('btn-loading');
            }
        }
    };

    // ==================== GERENCIADOR DE API ====================
    const ApiManager = {
        jsonpCallbackId: 0,

        requestJSONP: (url, callback) => {
            const callbackName = 'jsonp_callback_' + ApiManager.jsonpCallbackId++;
            
            const timeout = setTimeout(() => {
                if (window[callbackName]) {
                    delete window[callbackName];
                    callback(new Error('Timeout: A requisição demorou muito para responder'));
                }
            }, 15000);
            
            window[callbackName] = function(data) {
                clearTimeout(timeout);
                delete window[callbackName];
                if (script.parentNode) {
                    document.body.removeChild(script);
                }
                callback(null, data);
            };
            
            const script = document.createElement('script');
            script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
            script.onerror = function() {
                clearTimeout(timeout);
                delete window[callbackName];
                if (script.parentNode) {
                    document.body.removeChild(script);
                }
                callback(new Error('Falha ao carregar o script. Verifique sua conexão.'));
            };
            
            document.body.appendChild(script);
        },

        get: async (func, params = {}, forceRefresh = false) => {
            const cacheKey = `api_${func}_${JSON.stringify(params)}`;
            
            if (!forceRefresh) {
                const cached = CacheManager.get(cacheKey);
                if (cached) {
                    return cached;
                }
            }
            
            return new Promise((resolve, reject) => {
                const startTime = performance.now();
                let url = `${CONFIG.API_URL}?`;
                
                if (func) {
                    url += `func=${func}`;
                }
                
                for (const key in params) {
                    if (params[key] !== undefined && params[key] !== null) {
                        if (Array.isArray(params[key])) {
                            url += `&${key}=${encodeURIComponent(JSON.stringify(params[key]))}`;
                        } else {
                            url += `&${key}=${encodeURIComponent(params[key])}`;
                        }
                    }
                }
                
                if (forceRefresh) {
                    url += `&_=${Date.now()}`;
                }
                
                console.log('Fazendo requisição para:', url.replace(/(rm|senha)=[^&]*/g, '$1=***'));
                
                ApiManager.requestJSONP(url, (error, data) => {
                    const duration = performance.now() - startTime;
                    
                    if (error) {
                        reject(error);
                    } else if (data && data.success === false) {
                        reject(new Error(data.error));
                    } else {
                        CacheManager.set(cacheKey, data, 2 * 60 * 1000);
                        resolve(data);
                    }
                });
            });
        },

        post: async (action, dados) => {
            return new Promise((resolve, reject) => {
                const startTime = performance.now();
                let url = `${CONFIG.API_URL}?action=${action}`;
                
                for (const key in dados) {
                    if (dados[key] !== undefined && dados[key] !== null) {
                        if (Array.isArray(dados[key])) {
                            url += `&${key}=${encodeURIComponent(JSON.stringify(dados[key]))}`;
                        } else {
                            url += `&${key}=${encodeURIComponent(dados[key])}`;
                        }
                    }
                }
                
                console.log('Fazendo POST para:', url.replace(/(rm|senha)=[^&]*/g, '$1=***'));
                
                ApiManager.requestJSONP(url, (error, data) => {
                    const duration = performance.now() - startTime;
                    
                    if (error) {
                        reject(error);
                    } else if (data && data.success === false) {
                        reject(new Error(data.error));
                    } else {
                        resolve(data);
                    }
                });
            });
        }
    };

    // Aliases para compatibilidade
    const apiGet = ApiManager.get;
    const apiPost = ApiManager.post;

    // ==================== GERENCIADOR DE INTERFACE ====================
    const UIManager = {
        elements: {
            contentArea: document.getElementById('content-area'),
            userInfo: document.getElementById('user-info'),
            logoutBtn: document.getElementById('logoutBtn'),
            relatorioBtn: document.getElementById('relatorioBtn'),
            diagnosticoBtn: document.getElementById('diagnosticoBtn'),
            modalOverlay: document.getElementById('modal-overlay'),
            modalTitle: document.getElementById('modal-title'),
            modalMessage: document.getElementById('modal-message'),
            confirmModal: document.getElementById('confirm-modal'),
            confirmMessage: document.getElementById('confirm-message'),
            confirmCancel: document.getElementById('confirm-cancel'),
            confirmDelete: document.getElementById('confirm-delete')
        },

        showModal: (title, message) => {
            UIManager.elements.modalTitle.textContent = title;
            UIManager.elements.modalMessage.textContent = message;
            UIManager.elements.modalOverlay.classList.remove('hidden');
        },

        closeModal: () => {
            UIManager.elements.modalOverlay.classList.add('hidden');
        },

        showConfirmModal: (message, onConfirm) => {
            UIManager.elements.confirmMessage.textContent = message;
            UIManager.elements.confirmModal.classList.remove('hidden');
            
            UIManager.elements.confirmCancel.onclick = () => {
                UIManager.elements.confirmModal.classList.add('hidden');
                STATE.tarefaParaExcluir = null;
            };
            
            UIManager.elements.confirmDelete.onclick = () => {
                UIManager.elements.confirmModal.classList.add('hidden');
                if (onConfirm) onConfirm();
                STATE.tarefaParaExcluir = null;
            };
        },

        renderLoading: (message = 'Carregando...') => {
            return `
                <div class="text-center py-8">
                    <div class="spinner"></div>
                    <p class="mt-4 text-gray-600">${message}</p>
                </div>
            `;
        },

        renderError: (message) => {
            return `
                <div class="text-center py-8">
                    <p class="text-red-500 mb-4">${Utils.escapeHTML(message)}</p>
                    <button onclick="location.reload()" class="btn-primario">Tentar Novamente</button>
                </div>
            `;
        }
    };

    // ==================== SISTEMA DE AUTENTICAÇÃO ====================
    const AuthManager = {
        async login(credenciais) {
            const { email, senha } = credenciais;
            
            console.log('Tentando login com:', { email, senha: '***' });

            try {
                const response = await apiPost('login', { email, senha });
                
                if (response.success && response.user) {
                    console.log('Usuário logado com sucesso:', response.user.NomeCompleto);
                    return response.user;
                } else {
                    throw new Error('Credenciais inválidas');
                }
            } catch (error) {
                console.error('Erro no login:', error);
                throw new Error('Erro ao fazer login. Verifique suas credenciais.');
            }
        },

        logout() {
            STATE.usuarioLogado = null;
            STATE.tarefaEditando = null;
            STATE.relatorioAlunoVisivel = false;
            UIManager.elements.logoutBtn.classList.add('hidden');
            UIManager.elements.relatorioBtn.classList.add('hidden');
            UIManager.elements.diagnosticoBtn.classList.add('hidden');
            UIManager.elements.userInfo.innerHTML = '';
            STATE.contadoresAtivos.forEach(interval => clearInterval(interval));
            STATE.contadoresAtivos = [];
            CacheManager.clear();
            renderLogin();
        },

        updateUserInfo() {
            if (!STATE.usuarioLogado) return;
            
            const user = STATE.usuarioLogado;
            if (user.Perfil === "Professor") {
                UIManager.elements.userInfo.innerHTML = `
                    <div class="user-info-text">
                        Logado como: <span class="font-semibold text-red-700">${Utils.escapeHTML(user.NomeCompleto)} (${user.Perfil})</span>
                    </div>
                `;
                UIManager.elements.relatorioBtn.onclick = mostrarRelatorioProfessor;
                UIManager.elements.relatorioBtn.classList.remove('hidden');
                UIManager.elements.diagnosticoBtn.classList.remove('hidden');
                UIManager.elements.diagnosticoBtn.onclick = mostrarPainelDiagnostico;
            } else {
                UIManager.elements.userInfo.innerHTML = `
                    <div class="user-info-text">
                        Logado como: <span class="font-semibold text-red-700">${Utils.escapeHTML(user.NomeCompleto)} (${user.Perfil})</span> | 
                        Turma: ${Utils.escapeHTML(user.Turma || 'N/A')} | 
                        Nº: ${Utils.escapeHTML(user.Numero || 'N/A')}
                    </div>
                `;
                UIManager.elements.relatorioBtn.classList.add('hidden');
                UIManager.elements.diagnosticoBtn.classList.add('hidden');
            }
            
            UIManager.elements.logoutBtn.classList.remove('hidden');
        }
    };

    // ==================== COMPONENTES DE INTERFACE ====================
    const Components = {
        loginForm: () => {
            return `
                <div id="login" class="max-w-md mx-auto p-6">
                    <!-- Título removido conforme solicitado -->

    // Função de inicialização
    async function init() {
        try {

            renderLogin();
        } catch (error) {
            console.error('Erro ao inicializar:', error);
            UIManager.showModal('Aviso', 'Não foi possível inicializar o sistema. Verifique sua conexão.');

    // Renderizar tela de login
    function renderLogin() {
        UIManager.elements.contentArea.innerHTML = Components.loginForm();

        // Configurar evento de toggle de senha
        document.getElementById('toggleSenha').addEventListener('click', toggleRmVisibility);

        // Configurar evento de input para o email
        const emailPrefix = document.getElementById('email-prefix');
        const emailHidden = document.getElementById('email');

        emailPrefix.addEventListener('input', function() {
            emailHidden.value = this.value.trim() + '@portalsesisp.org.br';
        });

        // Configurar evento de submit do formulário
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleLogin(e);
        });
    }

    // Toggle visibilidade da senha
    function toggleRmVisibility() {
        const senhaInput = document.getElementById('senha');
        const toggleButton = document.getElementById('toggleSenha');
        
        STATE.rmVisible = !STATE.rmVisible;
        senhaInput.type = STATE.rmVisible ? 'text' : 'password';
        toggleButton.textContent = STATE.rmVisible ? '🙈' : '👁️';
    }

    // Manipular login
    async function handleLogin(event) {
        event.preventDefault();
        const emailPrefix = document.getElementById('email-prefix').value.trim();
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value.trim();
        
        const loginErro = document.getElementById('loginErro');
        const loginButton = document.getElementById('login-button');
        const loginText = document.getElementById('login-text');
        
        if (!emailPrefix) {
            loginErro.textContent = 'Por favor, insira seu nome e sobrenome.';
            loginErro.style.display = 'block';
            return;
        }

        Utils.setButtonLoading(loginButton, true);
        loginText.textContent = "Entrando...";
        loginErro.style.display = 'none';
        
        try {
            console.log('Tentando login com:', { email, senha: '***' });
            
            const response = await apiPost('login', { email, senha });
            
            if (response.success && response.data && response.data.success) {
                STATE.usuarioLogado = response.data.user;
                loginErro.style.display = 'none';
                
                UIManager.elements.contentArea.innerHTML = UIManager.renderLoading('Carregando painel...');
                
                // Carregar tarefas
                try {
                    const tarefasResponse = await apiGet('getTarefas', {}, true);
                    STATE.tarefas = tarefasResponse.data || tarefasResponse;
                    console.log('Tarefas carregadas:', STATE.tarefas.length);
                } catch (error) {
                    console.error('Erro ao carregar tarefas:', error);
                    STATE.tarefas = [];
                    UIManager.showModal('Aviso', 'Algumas funcionalidades podem estar limitadas devido a problemas de conexão.');
                }

                AuthManager.updateUserInfo();

                // Redirecionar para o painel apropriado
                if (STATE.usuarioLogado.Perfil === "Professor") {
                    await mostrarPainelProfessor();
                } else {
                    await mostrarPainelAluno();
                }
            } else {
                throw new Error(response.data?.error || response.error || 'Erro desconhecido no login');
            }
            
        } catch (error) {
            console.error('Erro no login:', error);
            loginErro.textContent = error.message;
            loginErro.style.display = 'block';
        } finally {
            Utils.setButtonLoading(loginButton, false);
            loginText.textContent = "Entrar";
        }
    }

    const salvarTarefa = Utils.debounce(async function() {
        const btnSalvar = document.getElementById('btnSalvarTarefa');
        
        try {
            Utils.setButtonLoading(btnSalvar, true);
            
            const turmasSelecionadas = Array.from(document.querySelectorAll('.turma-checkbox:checked'))
                .map(cb => cb.value);
            
            if (turmasSelecionadas.length === 0) {
                UIManager.showModal('Atenção', 'Selecione pelo menos uma turma.');
                return;
            }

            const tema = document.getElementById('tema').value.trim();
            const dataAula = document.getElementById('dataAula').value;

            if (!tema || !dataAula) {
                UIManager.showModal('Atenção', 'Preencha o tema e a data da aula.');
                return;
            }

            if (tema.length > CONFIG.MAX_TEMA_LEN) {
                UIManager.showModal('Atenção', `O tema deve ter no máximo ${CONFIG.MAX_TEMA_LEN} caracteres.`);
                return;
            }

            const parte1 = document.getElementById('parte1').value.trim();
            const parte2 = document.getElementById('parte2').value.trim();
            const parte3 = document.getElementById('parte3').value.trim();
            const parte4 = document.getElementById('parte4').value.trim();

            if (!parte1 || !parte2 || !parte3 || !parte4) {
                UIManager.showModal('Atenção', 'Todas as partes da tarefa devem ser preenchidas.');
                return;
            }

            if ([parte1, parte2, parte3, parte4].some(p => p.length > CONFIG.MAX_PARTE_LEN)) {
                UIManager.showModal('Atenção', `Cada parte deve ter no máximo ${CONFIG.MAX_PARTE_LEN} caracteres.`);
                return;
            }

            // Para cada turma selecionada, criar uma tarefa
            for (const turma of turmasSelecionadas) {
                const dados = {
                    Turma: turma,
                    Tema: tema,
                    Parte1: parte1,
                    Parte2: parte2,
                    Parte3: parte3,
                    Parte4: parte4,
                    DataAula: dataAula,
                    professor: STATE.usuarioLogado.NomeCompleto
                };

                await apiPost('criarTarefa', dados);
            }
            
            UIManager.showModal('Sucesso', `Tarefa criada com sucesso para as turmas: ${turmasSelecionadas.join(', ')}!`);
            
            CacheManager.remove('painel_professor');
            CacheManager.remove('tarefas_professor_lista');
            turmasSelecionadas.forEach(turma => {
                CacheManager.remove(`relatorio_${turma}`);
            });
            
            limparFormulario();
            await carregarTarefasProfessor();
            
        } catch (error) {
            UIManager.showModal('Erro', `Erro ao criar tarefa: ${error.message}`);
        } finally {
            Utils.setButtonLoading(btnSalvar, false);
        }
    }, 500);

        const tarefa = STATE.tarefas.find(t => t.ID === idTarefa);

        UIManager.showConfirmModal(
            `Tem certeza que deseja excluir a tarefa "${tarefa?.Tema}" da turma ${tarefa?.Turma}? Esta ação não pode ser desfeita.`,

            CacheManager.remove('painel_professor');

    function carregarStatusCache() {
        const container = document.getElementById('status-cache');
        
        try {
            const cacheKeys = Object.keys(localStorage).filter(k => k.startsWith('task_'));
            const totalItens = cacheKeys.length;
            
            // Calcular tamanho aproximado do cache
            let tamanhoTotal = 0;
            cacheKeys.forEach(key => {
                try {
                    const item = localStorage.getItem(key);
                    if (item) {
                        tamanhoTotal += new Blob([item]).size;
                    }
                } catch (e) {
                    console.warn('Erro ao calcular tamanho do item:', e);
                }
            });
            
            const tamanhoKB = (tamanhoTotal / 1024).toFixed(2);
            
            // Calcular eficiência
            const totalRequests = STATE.performanceMetrics.cacheHits + STATE.performanceMetrics.cacheMisses;
            const eficiencia = totalRequests > 0 ? 
                ((STATE.performanceMetrics.cacheHits / totalRequests) * 100).toFixed(1) : 0;

            // Teste de performance da API

            let tempoAPI = 0;
            
            try {
                const response = await apiGet('testBackend', {}, true);
                statusAPI = response.data ? 'OK' : 'Erro';
                tempoAPI = performance.now() - startTime;
            } catch (error) {
                statusAPI = 'Erro: ' + error.message;
            }
            
            // Coletar métricas de memória (se disponível)
            let memoriaUsada = 'N/A';
            let memoriaTotal = 'N/A';
            let recomendacoes = [];
            
            if (performance.memory) {
                memoriaUsada = (performance.memory.usedJSHeapSize / 1048576).toFixed(2) + ' MB';
                memoriaTotal = (performance.memory.totalJSHeapSize / 1048576).toFixed(2) + ' MB';
                
                // Recomendações baseadas nas métricas
                if (performance.memory.usedJSHeapSize > 50000000) { // 50MB
                    recomendacoes.push('Considere limpar o cache para liberar memória.');
                }
            } else {
                recomendacoes.push('Navegador não suporta medição de memória.');
            }
            
            if (tempoAPI > 1000) {
                recomendacoes.push('A API está respondendo lentamente. Verifique a conexão.');
            }
            
            if (STATE.performanceMetrics.cacheMisses > STATE.performanceMetrics.cacheHits) {
                recomendacoes.push('Alta taxa de cache misses. Considere ajustar o TTL do cache.');

            if (recomendacoes.length === 0) {

    async function carregarTarefasAluno() {
        const cacheKey = `tarefas_aluno_${STATE.usuarioLogado.RM}_dados`;
        const cached = CacheManager.get(cacheKey);
        
        if (cached) {
            renderTarefasAlunoFromCache(cached.tarefas, cached.entregas);
            return;
        }

        mostrarLoadingTarefasAluno();
        
        try {
            const response = await apiGet('getTarefasPorTurma', { turma: STATE.usuarioLogado.Turma }, true);
            const container = document.getElementById('tarefas-aluno-container');
            
            if (!response.data || response.data.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">Nenhuma tarefa disponível para sua turma.</div>';
                CacheManager.set(cacheKey, {tarefas: [], entregas: []}, 2 * 60 * 1000);
                return;
            }

            let entregas = [];
            try {
                const entregasResponse = await apiGet('getEntregasAluno', { 
                    rm: STATE.usuarioLogado.RM, 
                    turma: STATE.usuarioLogado.Turma 
                }, true);
                entregas = entregasResponse.data || [];
            } catch (error) {
                console.warn('Erro ao carregar entregas do aluno (não crítico):', error);
            }

            CacheManager.set(cacheKey, {tarefas: response.data, entregas: entregas}, 2 * 60 * 1000);
            
            renderTarefasAluno(response.data, entregas, container);
            
        } catch (error) {
            document.getElementById('tarefas-aluno-container').innerHTML = 
                `<div class="text-center text-red-500 py-8">Erro ao carregar tarefas: ${Utils.escapeHTML(error.message || String(error))}</div>`;
        }
    }

    function renderTarefasAluno(tarefasLocal, entregas, container) {
        container.innerHTML = '';
        
        if (!tarefasLocal || tarefasLocal.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-500 py-8">Nenhuma tarefa disponível para sua turma.</div>';
            return;
        }

        container.innerHTML = tarefasLocal.map((tarefa, index) => {
            const entregaTarefa = entregas.filter(e => e.ID_Tarefa === `TAREFA_${index + 1}`);
            
            return `

                <p class="text-sm text-gray-600 mt-1">Data da aula: ${Utils.formatarData(tarefa.DataAula)}</p>
                
                ${renderParteAluno(tarefa, 1, entregaTarefa, index)}
                ${renderParteAluno(tarefa, 2, entregaTarefa, index)}
                ${renderParteAluno(tarefa, 3, entregaTarefa, index)}
                ${renderParteAluno(tarefa, 4, entregaTarefa, index)}
            </div>
            `;
        }).join('');
    }

    function renderParteAluno(tarefa, numeroParte, entregas, tarefaIndex) {
        const parteConteudo = tarefa[`Parte${numeroParte}`];
        const entrega = entregas.find(e => e.Parte === numeroParte);
        const linkSalvo = entrega ? entrega.Link : '';
        const inputId = `link-${tarefa.ID}-${numeroParte}`;
        const temLinkSalvo = linkSalvo && String(linkSalvo).trim() !== '';
        
        // Calcular status baseado na data atual
        const agora = new Date();
        const dataAula = new Date(tarefa.DataAula);
        let status = 'aguardando';
        let textoStatus = 'Aguardando';
        
        // Calcular data de entrega para cada parte
        const diasOffset = (numeroParte - 1) * 7; // Parte 1: 0 dias, Parte 2: 7 dias, etc.
        const dataEntrega = new Date(dataAula);
        dataEntrega.setDate(dataEntrega.getDate() + diasOffset);
        
        if (agora > dataEntrega) {
            // Verificar se já passou do dia de entrega
            const umDiaDepois = new Date(dataEntrega);
            umDiaDepois.setDate(umDiaDepois.getDate() + 1);
            
            if (agora > umDiaDepois) {
                status = 'expirado';
                textoStatus = 'Expirado';
            } else {
                status = 'disponivel';
                textoStatus = 'Disponível hoje';
            }
        } else {
            const diffTempo = dataEntrega.getTime() - agora.getTime();
            const diffDias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));
            
            if (diffDias <= 7) {
                status = 'disponivel';
                textoStatus = `Libera em ${diffDias} dias`;
            } else {
                status = 'aguardando';
                textoStatus = `Libera em ${diffDias} dias`;
            }
        }
        
        return `
        <div class="mt-3 p-3 bg-gray-50 rounded border">
            <div class="flex justify-between items-center">
                <strong>Parte ${numeroParte}</strong>
                <span class="contador ${status}">${textoStatus}</span>
            </div>
            <div class="conteudo-formatado mt-2">${Utils.escapeHTML(parteConteudo)}</div>
            <div class="link-container mt-2">
                <input type="text" 
                       class="link-input ${temLinkSalvo ? 'link-salvo' : ''}" 
                       placeholder="${temLinkSalvo ? 'Link já enviado' : 'Cole o link da atividade aqui'}" 
                       id="${inputId}"
                       value="${linkSalvo || ''}"
                       ${temLinkSalvo || status !== 'disponivel' ? 'disabled' : ''}>
                ${!temLinkSalvo ? `
                    <button class="btn-primario btn-link" 
                            onclick="salvarLinkAluno('${tarefa.ID}', ${numeroParte})"
                            ${status !== 'disponivel' ? 'disabled' : ''}>
                        Salvar
                    </button>
                ` : ''}
                <button class="btn-secundario btn-link" 
                        onclick="excluirLinkAluno('${tarefa.ID}', ${numeroParte})"
                        ${!temLinkSalvo ? 'disabled' : ''}>
                    Excluir
                </button>
            </div>
            ${temLinkSalvo ? '<p class="text-green-600 text-sm mt-1">✓ Link salvo com sucesso</p>' : ''}
        </div>`;
    }

    async function salvarLinkAluno(idTarefa, parte) {
        const input = document.getElementById(`link-${idTarefa}-${parte}`);
        const link = input ? input.value.trim() : '';
        
        if (!link) {
            UIManager.showModal('Atenção', 'Por favor, cole um link válido.');
            return;
        }

        try {
            await apiPost('entregarTarefa', {
                ID_Tarefa: idTarefa,
                RM_Aluno: STATE.usuarioLogado.RM,
                NomeAluno: STATE.usuarioLogado.NomeCompleto,
                Turma: STATE.usuarioLogado.Turma,
                Parte: parte,
                Link: link
            });
            
            UIManager.showModal('Sucesso', `Link da parte ${parte} salvo com sucesso!`);
            
            CacheManager.remove(`painel_aluno_${STATE.usuarioLogado.RM}`);
            CacheManager.remove(`tarefas_aluno_${STATE.usuarioLogado.RM}_dados`);
            
            await carregarTarefasAluno();
        } catch (error) {
            UIManager.showModal('Erro', `Erro ao salvar link: ${error.message}`);
        }
    }

    async function excluirLinkAluno(idTarefa, parte) {
        try {
            await apiPost('excluirEntrega', {
                ID_Tarefa: idTarefa,
                RM_Aluno: STATE.usuarioLogado.RM,
                Turma: STATE.usuarioLogado.Turma,
                Parte: parte

            UIManager.showModal('Sucesso', `Link da parte ${parte} excluído com sucesso!`);
            
            CacheManager.remove(`painel_aluno_${STATE.usuarioLogado.RM}`);
            CacheManager.remove(`tarefas_aluno_${STATE.usuarioLogado.RM}_dados`);
            
            await carregarTarefasAluno();
        } catch (error) {
            UIManager.showModal('Erro', `Erro ao excluir link: ${error.message}`);
        }
    }

                <div class="text-center py-8">
                    <p class="text-red-500">Erro ao carregar relatório: ${Utils.escapeHTML(error.message || String(error))}</p>
                    <button onclick="carregarRelatorioTurma('${turma}')" class="btn-secundario mt-4">
                        Tentar Novamente
                    </button>
                </div>
            `;
        }
    }

    function exportarParaExcel(turma) {
        if (!turma) {
            UIManager.showModal('Atenção', 'Selecione uma turma primeiro.');
            return;
        }
        
        try {
            const table = document.getElementById('tabela-relatorio');
            if (!table) {
                UIManager.showModal('Erro', 'Tabela não encontrada para exportação.');
                return;
            }

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.table_to_sheet(table);
            XLSX.utils.book_append_sheet(wb, ws, `Turma ${turma}`);
            XLSX.writeFile(wb, `relatorio_turma_${turma}.xlsx`);
        } catch (error) {
            UIManager.showModal('Erro', `Erro ao exportar para Excel: ${error.message}`);
        }
    }

    function exportarParaPDF(turma) {
        if (!turma) {
            UIManager.showModal('Atenção', 'Selecione uma turma primeiro.');
            return;
        }
        
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text(`Relatório da Turma ${turma}`, 14, 15);

            doc.setFontSize(10);
            doc.text(`Emitido em: ${new Date().toLocaleDateString()}`, 14, 22);

            const table = document.getElementById('tabela-relatorio');
            doc.autoTable({
                html: table,
                startY: 30,
                styles: { fontSize: 8 },
                headStyles: { fillColor: [204, 0, 0] }
            });

            doc.save(`relatorio_turma_${turma}.pdf`);
        } catch (error) {
            UIManager.showModal('Erro', `Erro ao exportar para PDF: ${error.message}`);
        }
    }

    function limparCache() {
        CacheManager.clear();
        UIManager.showModal('Sucesso', 'Cache limpo com sucesso!');
        setTimeout(() => {
            carregarStatusCache();
        }, 1000);
    }

    // ==================== INICIALIZAÇÃO ====================
    document.addEventListener('DOMContentLoaded', init);

    // ==================== EXPORTAÇÃO DE FUNÇÕES GLOBAIS ====================
    window.logout = function() {
        AuthManager.logout();
    };

    window.closeModal = function() {
        UIManager.closeModal();
    };

    window.toggleRmVisibility = toggleRmVisibility;
    window.mostrarPainelDiagnostico = mostrarPainelDiagnostico;
    window.coletarMetricasPerformance = coletarMetricasPerformance;
    window.limparCache = limparCache;
    window.mostrarPainelProfessor = mostrarPainelProfessor;
    window.mostrarPainelAluno = mostrarPainelAluno;
    window.mostrarRelatorioProfessor = mostrarRelatorioProfessor;
    window.exportarParaExcel = exportarParaExcel;
    window.exportarParaPDF = exportarParaPDF;
    window.carregarRelatorioTurma = carregarRelatorioTurma;
    window.salvarTarefa = salvarTarefa;
    window.atualizarTarefa = atualizarTarefa;
    window.excluirTarefa = excluirTarefa;
    window.solicitarExclusaoTarefa = solicitarExclusaoTarefa;
    window.editarTarefa = editarTarefa;
    window.limparFormulario = limparFormulario;
    window.salvarLinkAluno = salvarLinkAluno;
    window.excluirLinkAluno = excluirLinkAluno;
    </script>
</body>
</html>
