<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Tarefas Escolar</title>
    
    <!-- Otimizações de Performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://script.google.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        :root {
            --cor-primaria: #CC0000;
            --cor-secundaria: #A00000;
            --cor-sucesso: #10b981;
            --cor-erro: #ef4444;
            --cor-aviso: #f59e0b;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f4f7f9;
            margin: 0;
            padding: 0;
        }
        
        .card { 
            background-color: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.2); 
        }
        
        .btn-primario { 
            background-color: var(--cor-primaria); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: all 0.2s; 
            cursor: pointer; 
            font-size: 14px;
            border: none;
        }
        
        .btn-primario:hover { 
            background-color: var(--cor-secundaria); 
            transform: translateY(-1px);
        }
        
        .btn-secundario { 
            background-color: #d1d5db; 
            color: #1e1e1e; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: background-color 0.2s; 
            cursor: pointer; 
            border: none;
        }
        
        .btn-secundario:hover { 
            background-color: #9ca3af; 
        }
        
        input, textarea, select {
            border: 1px solid #d1d5db; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            transition: border-color 0.2s; 
            margin-top: 4px; 
            margin-bottom: 8px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus { 
            border-color: var(--cor-primaria); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.1);
        }
        
        .hidden { 
            display: none; 
        }
        
        .loading-skeleton {
            background: linear-gradient(90deg, #f9fafb 25%, #f3f4f6 50%, #f9fafb 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 6px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .spinner {
            border: 2px solid #f3f3f3;
            border-radius: 50%;
            border-top: 2px solid var(--cor-primaria);
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Componentes Reutilizáveis */
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #374151;
            font-size: 1rem;
        }
        
        .table-responsive {
            overflow-x: auto;
        }
        
        .compact-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .compact-table th, 
        .compact-table td {
            padding: 12px 8px;
            border: 1px solid #e5e7eb;
        }
        
        .compact-table th {
            background-color: var(--cor-primaria);
            color: white;
            font-weight: 600;
        }
        
        .compact-table tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }
        
        /* Utilitários de Layout */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .space-x-2 > * + * { margin-left: 0.5rem; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        
        /* Componentes Específicos */
        .contador {
            display: inline-block;
            padding: 4px 8px;
            background-color: #f3f4f6;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 8px;
            min-width: 80px;
            text-align: center;
        }
        
        .contador.disponivel {
            background-color: #d1fae5;
            color: #065f46;
        }
        
        .contador.expirado {
            background-color: #fee2e2;
            color: #991b1b;
        }
        
        .contador.aguardando {
            background-color: #e5e7eb;
            color: #374151;
        }
        
        .turma-column {
            width: 80px;
            text-align: center;
        }
        
        .data-column {
            width: 120px;
            text-align: center;
        }
        
        .acoes-column {
            width: 200px;
            text-align: center;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 1rem;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        /* Cards de Diagnóstico */
        .diagnostico-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .diagnostico-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            background-color: white;
        }
        
        .test-result {
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        .test-success {
            background-color: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        
        .test-error {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        
        .test-warning {
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            color: #92400e;
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .diagnostico-grid {
                grid-template-columns: 1fr;
            }
            
            .compact-table {
                font-size: 0.875rem;
            }
            
            .acoes-column {
                width: 150px;
            }
        }

        /* Estilos específicos para login */
        .email-container {
            display: flex;
            width: 100%;
        }
        
        .email-prefix {
            flex: 1;
        }
        
        .email-suffix {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            border-left: none;
            border-radius: 0 8px 8px 0;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            color: #6b7280;
            font-weight: 500;
        }
        
        .email-prefix input {
            border-radius: 8px 0 0 8px !important;
            border-right: none;
        }
        
        .password-container {
            position: relative;
            width: 100%;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            z-index: 10;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        .password-toggle:hover {
            color: #374151;
        }
        
        .password-toggle:focus {
            outline: none;
        }
        
        .password-container input {
            padding-right: 40px;
        }

        /* Estilos para tarefas e formulários */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        
        .checkbox-item input[type="checkbox"] {
            margin: 0;
            margin-right: 4px;
        }
        
        .checkbox-item label {
            margin-bottom: 0;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        
        .turma-checkbox {
            width: 16px;
            height: 16px;
            accent-color: #CC0000;
            cursor: pointer;
        }
        
        .form-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .form-row label {
            margin-bottom: 0;
            min-width: 120px;
            font-size: 1rem;
        }
        
        .form-row input, .form-row textarea {
            flex: 1;
            margin-top: 0;
        }
        
        .link-container {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }
        
        .link-input {
            flex: 1;
            padding: 8px;
            font-size: 0.875rem;
        }
        
        .btn-link {
            padding: 8px 12px;
            font-size: 0.8rem;
            position: relative;
        }
        
        .btn-link:disabled {
            background-color: #9ca3af !important;
            color: #6b7280 !important;
            cursor: not-allowed !important;
            opacity: 0.6;
        }
        
        .link-salvo {
            background-color: #f3f4f6 !important;
            color: #6b7280 !important;
            cursor: not-allowed !important;
            border: 1px solid #d1d5db;
        }
        
        .conteudo-formatado {
            white-space: pre-line;
            line-height: 1.6;
            margin-top: 8px;
        }
        
        .instrucoes-box {
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .fundamento-cientifico {
            background-color: #fefce8;
            border: 1px solid #fef08a;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            cursor: pointer;
        }
        
        .fundamento-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #92400e;
        }
        
        .fundamento-content {
            margin-top: 12px;
            display: none;
        }
        
        .fundamento-content.expandido {
            display: block;
        }
        
        .expand-icon {
            transition: transform 0.2s;
        }
        
        .expand-icon.expandido {
            transform: rotate(180deg);
        }
        
        .retencao-aviso {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .retencao-50 {
            background-color: #fef3c7;
            color: #92400e;
        }
        
        .retencao-25 {
            background-color: #d1fae5;
            color: #065f46;
        }
        
        .retencao-15 {
            background-color: #dbeafe;
            color: #1e40af;
        }
        
        .retencao-10 {
            background-color: #e0e7ff;
            color: #3730a3;
        }
        
        .horario-info {
            font-size: 0.75rem;
            margin-top: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
        }
        
        .horario-maxima {
            background-color: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }
        
        .horario-fora {
            background-color: #fee2e2;
            color: #991b1b;
        }
        
        .conteudo-bloqueado {
            color: #6b7280;
            font-style: italic;
            padding: 8px;
            background-color: #f9fafb;
            border-radius: 4px;
            margin-top: 8px;
        }
        
        .btn-editar {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
        }
        
        .btn-editar:hover {
            background-color: #2563eb;
        }
        
        .btn-excluir {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
        }
        
        .btn-excluir:hover {
            background-color: #dc2626;
        }
        
        .btn-exportar {
            background-color: #059669;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
            cursor: pointer;
            border: none;
            margin-left: 10px;
        }
        
        .btn-exportar:hover {
            background-color: #047857;
        }
        
        .turmas-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .turmas-buttons {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
        }
        
        .btn-turma-compact {
            background-color: #CC0000;
            color: white;
            padding: 8px 12px;
            border-radius: 0;
            font-weight: 600;
            transition: background-color 0.2s;
            cursor: pointer;
            border: none;
            min-width: 40px;
            text-align: center;
            border-right: 1px solid white;
        }
        
        .btn-turma-compact:first-child {
            border-radius: 6px 0 0 6px;
        }
        
        .btn-turma-compact:last-child {
            border-radius: 0 6px 6px 0;
            border-right: none;
        }
        
        .btn-turma-compact:hover {
            background-color: #A00000;
        }
        
        .btn-turma-compact.active {
            background-color: #A00000;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #CC0000;
        }
        
        .export-buttons-container {
            display: flex;
            gap: 10px;
        }
        
        .numero-coluna {
            width: 50px;
            text-align: center;
        }
        
        .media-coluna {
            width: 100px;
            text-align: center;
            font-weight: bold;
        }
        
        .parte-column {
            width: 60px;
            text-align: center;
            font-size: 0.75rem;
        }
        
        .media-tarefa-column {
            width: 70px;
            text-align: center;
            font-weight: bold;
        }
        
        .header-tarefa {
            background-color: #CC0000;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        
        .subheader-tarefa {
            background-color: #e53e3e;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            text-align: center;
        }
        
        .tarefa-group {
            border-right: 2px solid #c53030;
        }
        
        .tarefa-group:last-child {
            border-right: none;
        }
        
        .btn-formatacao {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        
        .btn-formatacao:hover {
            background-color: #e5e7eb;
        }
        
        .btn-loading {
            position: relative;
            color: transparent;
        }
        
        .btn-loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        
        .tarefa-atualizada {
            animation: highlight 2s ease;
        }
        
        @keyframes highlight {
            0% { background-color: #d1fae5; }
            100% { background-color: transparent; }
        }

        /* Novos estilos para a versão 21.1 */
        .aluno-relatorio-card {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .aluno-relatorio-card:hover {
            border-color: #CC0000;
            background-color: #fef2f2;
        }
        
        .aluno-relatorio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .aluno-relatorio-content {
            margin-top: 12px;
            display: none;
        }
        
        .aluno-relatorio-content.expandido {
            display: block;
        }
        
        .tarefa-expand-button {
            background: none;
            border: none;
            color: #CC0000;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 8px;
        }
        
        .tarefa-expand-content {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #f9fafb;
            border-radius: 6px;
        }
        
        .tarefa-expand-content.expandido {
            display: block;
        }
        
        /* Para melhorar a responsividade em telas menores */
        @media (max-width: 640px) {
            .checkbox-group {
                gap: 6px;
            }
            
            .checkbox-item label {
                font-size: 0.9rem;
            }
        }

        /* Garantir que modais estejam escondidos na tela de login */
        body:not(.logged-in) .modal-overlay,
        body:not(.logged-in) .modal-confirmacao {
            display: none !important;
        }
        
        /* Relatório melhorado */
        .relatorio-tarefa-header {
            background-color: #CC0000;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        
        .relatorio-parte-header {
            background-color: #e53e3e;
            color: white;
            font-size: 0.7rem;
            text-align: center;
        }

        /* Novos estilos para versão 21.1 - Exclusão Simplificada */
        .btn-excluir-loading {
            position: relative;
            color: transparent;
        }
        
        .btn-excluir-loading::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        
        .debug-info {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .debug-section {
            margin-bottom: 15px;
        }
        
        .debug-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #374151;
        }

        /* Estilos para o novo botão Tarefas */
        .btn-tarefas {
            background-color: #000000;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 14px;
            border: none;
            margin-right: 8px;
        }
        
        .btn-tarefas:hover {
            background-color: #333333;
            transform: translateY(-1px);
        }

        /* Estilos para diagnóstico em linha */
        .diagnostico-linha {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .diagnostico-item {
            flex: 1;
            min-width: 200px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            background-color: white;
        }
        
        .metricas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .metrica-item {
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="min-h-screen flex items-start justify-center p-4 sm:p-8">
    <div id="app-container" class="w-full max-w-6xl bg-white shadow-xl rounded-2xl p-6 sm:p-8 transition-all duration-300">
        <header class="mb-8 border-b pb-4">
            <div class="header-content">
                <h1 class="text-3xl font-extrabold text-red-700 text-center">Sistema de Gestão de Tarefas</h1>
                <div id="user-info" class="user-info-container text-center mt-2 text-gray-600"></div>
                <div class="absolute top-0 right-0 flex space-x-2">
                    <button id="tarefasBtn" class="btn-tarefas hidden">Tarefas</button>
                    <button id="diagnosticoBtn" class="btn-primario hidden">Diagnóstico</button>
                    <button id="relatorioBtn" class="btn-primario hidden" style="background-color: #10b981;">Relatório</button>
                    <button onclick="logout()" id="logoutBtn" class="btn-secundario hidden">Sair</button>
                </div>
            </div>
        </header>

        <div id="content-area"></div>

        <footer class="mt-8 pt-4 border-t text-xs text-gray-500 text-center">
            Desenvolvido por Geovane Modena | Versão 21.2
        </footer>
    </div>

    <!-- Modal Principal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title" class="text-lg font-bold mb-2"></h3>
            <p id="modal-message" class="text-gray-700"></p>
            <button onclick="closeModal()" class="btn-primario w-full mt-4">Fechar</button>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO E CONSTANTES ====================
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbx3n_ZZobnfty_21WjCTJ5t4Yb0UblaNZ1TCGTi-NKbpPfQXlZAEm8Bb7oSLSyR5T_OUA/exec",
            CACHE_TTL: 5 * 60 * 1000, // 5 minutos
            MAX_TEMA_LEN: 200,
            MAX_PARTE_LEN: 4000,
            TURMAS: ["1A", "1B", "2A", "2B", "3A", "3B"]
        };

        // ==================== ESTADO GLOBAL ====================
        const STATE = {
            usuarioLogado: null,
            tarefas: [],
            tarefaEditando: null,
            contadoresAtivos: [],
            rmVisible: false,
            relatorioAlunoVisivel: false,
            metricasPerformance: {
                chamadasAPI: 0,
                tempoTotal: 0,
                memoriaUsada: 0,
                memoriaTotal: 0
            }
        };

        // ==================== SISTEMA DE CACHE ====================
        const CacheManager = {
            get: (key) => {
                try {
                    const item = localStorage.getItem(`task_${key}`);
                    if (item) {
                        const { data, expiry } = JSON.parse(item);
                        if (Date.now() > expiry) {
                            localStorage.removeItem(`task_${key}`);
                            return null;
                        }
                        return data;
                    }
                } catch (e) {
                    console.warn('Erro ao acessar cache:', e);
                }
                return null;
            },
            
            set: (key, data, ttl = CONFIG.CACHE_TTL) => {
                try {
                    const item = {
                        data,
                        expiry: Date.now() + ttl
                    };
                    localStorage.setItem(`task_${key}`, JSON.stringify(item));
                    return true;
                } catch (e) {
                    console.warn('Erro ao salvar no cache:', e);
                    return false;
                }
            },
            
            remove: (key) => {
                try {
                    localStorage.removeItem(key.startsWith('task_') ? key : `task_${key}`);
                } catch (e) {
                    console.warn('Erro ao remover do cache:', e);
                }
            },
            
            clear: () => {
                try {
                    const keys = Object.keys(localStorage).filter(k => k.startsWith('task_'));
                    keys.forEach(k => localStorage.removeItem(k));
                } catch (e) {
                    console.warn('Erro ao limpar cache:', e);
                }
            },

            getCacheStats: () => {
                try {
                    const keys = Object.keys(localStorage).filter(k => k.startsWith('task_'));
                    const totalItens = keys.length;
                    let tamanhoTotal = 0;
                    
                    keys.forEach(key => {
                        const item = localStorage.getItem(key);
                        if (item) {
                            tamanhoTotal += new Blob([item]).size;
                        }
                    });
                    
                    const eficiencia = totalItens > 0 ? Math.min(100, (totalItens / 100) * 100) : 0; // Simulação
                    
                    return {
                        itens: totalItens,
                        tamanho: tamanhoTotal,
                        eficiencia: eficiencia
                    };
                } catch (e) {
                    console.warn('Erro ao calcular estatísticas do cache:', e);
                    return { itens: 0, tamanho: 0, eficiencia: 0 };
                }
            }
        };

        // ==================== UTILITÁRIOS ====================
        const Utils = {
            debounce: (func, wait, immediate = false) => {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        timeout = null;
                        if (!immediate) func(...args);
                    };
                    const callNow = immediate && !timeout;
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                    if (callNow) func(...args);
                };
            },

            formatarData: (dataISO) => {
                if (!dataISO) return 'N/A';
                const data = new Date(dataISO);
                return isNaN(data.getTime()) ? 'N/A' : data.toLocaleDateString('pt-BR');
            },

            escapeHTML: (texto) => {
                if (!texto) return '';
                return String(texto)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            },

            setButtonLoading: (button, isLoading) => {
                if (!button) return;
                if (isLoading) {
                    button.disabled = true;
                    button.classList.add('btn-excluir-loading');
                } else {
                    button.disabled = false;
                    button.classList.remove('btn-excluir-loading');
                }
            },

            formatarConteudoParaExibicao: (texto) => {
                if (!texto) return '';
                const textoStr = String(texto);
                return textoStr
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            },

            formatarBytes: (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        };

        // ==================== GERENCIADOR DE API ====================
        const ApiManager = {
            jsonpCallbackId: 0,
            chamadasAPI: 0,
            tempoTotalAPI: 0,

            requestJSONP: (url, callback) => {
                const callbackName = 'jsonp_callback_' + ApiManager.jsonpCallbackId++;
                const inicio = performance.now();
                
                const timeout = setTimeout(() => {
                    if (window[callbackName]) {
                        delete window[callbackName];
                        callback(new Error('Timeout: A requisição demorou muito para responder'));
                    }
                }, 15000);
                
                window[callbackName] = function(data) {
                    const fim = performance.now();
                    const tempo = fim - inicio;
                    
                    clearTimeout(timeout);
                    delete window[callbackName];
                    if (script.parentNode) {
                        document.body.removeChild(script);
                    }
                    
                    // Atualizar métricas
                    ApiManager.chamadasAPI++;
                    ApiManager.tempoTotalAPI += tempo;
                    STATE.metricasPerformance.chamadasAPI = ApiManager.chamadasAPI;
                    STATE.metricasPerformance.tempoTotal = ApiManager.tempoTotalAPI;
                    
                    callback(null, data);
                };
                
                const script = document.createElement('script');
                script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
                script.onerror = function() {
                    const fim = performance.now();
                    const tempo = fim - inicio;
                    
                    clearTimeout(timeout);
                    delete window[callbackName];
                    if (script.parentNode) {
                        document.body.removeChild(script);
                    }
                    
                    // Atualizar métricas mesmo em caso de erro
                    ApiManager.chamadasAPI++;
                    ApiManager.tempoTotalAPI += tempo;
                    STATE.metricasPerformance.chamadasAPI = ApiManager.chamadasAPI;
                    STATE.metricasPerformance.tempoTotal = ApiManager.tempoTotalAPI;
                    
                    callback(new Error('Falha ao carregar o script. Verifique sua conexão.'));
                };
                
                document.body.appendChild(script);
            },

            get: async (func, params = {}, forceRefresh = false) => {
                const cacheKey = `api_${func}_${JSON.stringify(params)}`;
                
                if (!forceRefresh) {
                    const cached = CacheManager.get(cacheKey);
                    if (cached) {
                        return cached;
                    }
                }
                
                return new Promise((resolve, reject) => {
                    let url = `${CONFIG.API_URL}?`;
                    
                    if (func) {
                        url += `func=${func}`;
                    }
                    
                    for (const key in params) {
                        if (params[key] !== undefined && params[key] !== null) {
                            url += `&${key}=${encodeURIComponent(params[key])}`;
                        }
                    }
                    
                    if (forceRefresh) {
                        url += `&_=${Date.now()}`;
                    }
                    
                    console.log('Fazendo requisição para:', url.replace(/(email|senha)=[^&]*/g, '$1=***'));
                    
                    ApiManager.requestJSONP(url, (error, data) => {
                        if (error) {
                            reject(error);
                        } else if (data && data.success === false) {
                            reject(new Error(data.error));
                        } else {
                            CacheManager.set(cacheKey, data, 2 * 60 * 1000);
                            resolve(data);
                        }
                    });
                });
            },

            post: async (action, dados) => {
                return new Promise((resolve, reject) => {
                    let url = `${CONFIG.API_URL}?action=${action}`;
                    
                    for (const key in dados) {
                        if (dados[key] !== undefined && dados[key] !== null) {
                            if (Array.isArray(dados[key])) {
                                url += `&${key}=${encodeURIComponent(JSON.stringify(dados[key]))}`;
                            } else {
                                url += `&${key}=${encodeURIComponent(dados[key])}`;
                            }
                        }
                    }
                    
                    console.log('Fazendo POST para:', url.replace(/(email|senha)=[^&]*/g, '$1=***'));
                    
                    ApiManager.requestJSONP(url, (error, data) => {
                        if (error) {
                            reject(error);
                        } else if (data && data.success === false) {
                            reject(new Error(data.error));
                        } else {
                            resolve(data);
                        }
                    });
                });
            },

            getMetricas: () => {
                return {
                    chamadasAPI: ApiManager.chamadasAPI,
                    tempoTotalAPI: ApiManager.tempoTotalAPI,
                    tempoMedioAPI: ApiManager.chamadasAPI > 0 ? ApiManager.tempoTotalAPI / ApiManager.chamadasAPI : 0
                };
            },

            resetMetricas: () => {
                ApiManager.chamadasAPI = 0;
                ApiManager.tempoTotalAPI = 0;
                STATE.metricasPerformance.chamadasAPI = 0;
                STATE.metricasPerformance.tempoTotal = 0;
            }
        };

        // Aliases para compatibilidade
        const apiGet = ApiManager.get;
        const apiPost = ApiManager.post;

                UIManager.elements.logoutBtn.classList.remove('hidden');

        };

        // ==================== SISTEMA DE TEMPO E PRAZOS ====================
        const TimeManager = {
            calcularStatusParteDiaUnico(dataAula, diasOffset) {
                const agora = new Date();
                const base = new Date(dataAula);

                if (isNaN(base.getTime())) {
                    return {
                        texto: 'Data inválida',
                        classe: 'aguardando',
                        liberada: false,
                        expirado: false,
                        dentroHorarioEntrega: false
                    };
                }

                base.setHours(0, 0, 0, 0);
                const diaEntrega = new Date(base);
                diaEntrega.setDate(diaEntrega.getDate() + diasOffset);

                const inicio = new Date(diaEntrega);
                inicio.setHours(13, 0, 0, 0);

                const fim = new Date(diaEntrega);
                fim.setHours(22, 0, 0, 0);

                // Se estiver antes do início
                if (agora < inicio) {
                    const diff = inicio - agora;
                    const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const horas = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                    let texto = '';
                    if (dias > 0) {
                        texto = `Libera em ${dias}d ${horas}h ${minutos}m`;
                    } else if (horas > 0) {
                        texto = `Libera em ${horas}h ${minutos}m`;
                    } else {
                        texto = `Libera em ${minutos}m`;
                    }

                    return {
                        texto,
                        classe: 'aguardando',
                        liberada: false,
                        expirado: false,
                        dentroHorarioEntrega: false
                    };
                }

                // Se estiver depois do fim
                if (agora > fim) {
                    return {
                        texto: 'Expirado',
                        classe: 'expirado',
                        liberada: false,
                        expirado: true,
                        dentroHorarioEntrega: false
                    };
                }

                // Dentro do único dia de entrega (13h–22h)
                const diffFim = fim - agora;
                const diasFim = Math.floor(diffFim / (1000 * 60 * 60 * 24));
                const horasFim = Math.floor((diffFim % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutosFim = Math.floor((diffFim % (1000 * 60 * 60)) / (1000 * 60));
                
                let texto = '';
                if (diasFim > 0) {
                    texto = `Termina em ${diasFim}d ${horasFim}h ${minutosFim}m`;
                } else if (horasFim > 0) {
                    texto = `Termina em ${horasFim}h ${minutosFim}m`;
                } else {
                    texto = `Termina em ${minutosFim}m`;
                }

                return {
                    texto,
                    classe: 'disponivel',
                    liberada: true,
                    expirado: false,
                    dentroHorarioEntrega: true
                };
            },

            calcularContadoresOtimizado(dataAula) {
                return {
                    parte1: TimeManager.calcularStatusParteDiaUnico(dataAula, 0),
                    parte2: TimeManager.calcularStatusParteDiaUnico(dataAula, 7),
                    parte3: TimeManager.calcularStatusParteDiaUnico(dataAula, 14),
                    parte4: TimeManager.calcularStatusParteDiaUnico(dataAula, 28)
                };
            },

            iniciarAtualizacaoContadores() {
                STATE.contadoresAtivos.forEach(interval => clearInterval(interval));
                STATE.contadoresAtivos = [];
                
                const interval = setInterval(() => {
                    if (STATE.usuarioLogado && STATE.usuarioLogado.Perfil === 'Aluno') {
                        atualizarContadoresAluno();
                    }
                }, 1000);
                
                STATE.contadoresAtivos.push(interval);
            }
        };

        // ==================== COMPONENTES DE INTERFACE ====================

        // ==================== FUNÇÕES PRINCIPAIS ====================

                        <h3 class="text-2xl font-bold mb-4 text-red-700" id="titulo-formulario">${STATE.tarefaEditando ? 'Editar Tarefa' : 'Painel de Tarefas'}</h3>
                        
                        <div class="form-group">

        // ==================== FUNÇÃO CORRIGIDA PARA SALVAR TAREFA ====================
        async function salvarTarefaCorrigida() {
            const btnSalvar = document.getElementById('btnSalvarTarefa');
            
            try {
                Utils.setButtonLoading(btnSalvar, true);
                
                const turmasSelecionadas = Array.from(document.querySelectorAll('.turma-checkbox:checked'))
                    .map(cb => cb.value);
                
                if (turmasSelecionadas.length === 0) {
                    UIManager.showModal('Atenção', 'Selecione pelo menos uma turma.');
                    return;
                }

                const tema = document.getElementById('tema').value.trim();
                const dataAula = document.getElementById('dataAula').value;

                if (!tema || !dataAula) {
                    UIManager.showModal('Atenção', 'Preencha o tema e a data da aula.');
                    return;
                }

                if (tema.length > CONFIG.MAX_TEMA_LEN) {
                    UIManager.showModal('Atenção', `O tema deve ter no máximo ${CONFIG.MAX_TEMA_LEN} caracteres.`);
                    return;
                }

                const parte1 = document.getElementById('parte1').value.trim();
                const parte2 = document.getElementById('parte2').value.trim();
                const parte3 = document.getElementById('parte3').value.trim();
                const parte4 = document.getElementById('parte4').value.trim();

                if (!parte1 || !parte2 || !parte3 || !parte4) {
                    UIManager.showModal('Atenção', 'Todas as partes da tarefa devem ser preenchidas.');
                    return;
                }

                if ([parte1, parte2, parte3, parte4].some(p => p.length > CONFIG.MAX_PARTE_LEN)) {
                    UIManager.showModal('Atenção', `Cada parte deve ter no máximo ${CONFIG.MAX_PARTE_LEN} caracteres.`);
                    return;
                }

                console.log('Iniciando criação de tarefas para turmas:', turmasSelecionadas);
                
                // Para cada turma selecionada, criar uma tarefa
                const promises = turmasSelecionadas.map(async (turma) => {
                    const dados = {
                        Turma: turma,
                        Tema: tema,
                        Parte1: parte1,
                        Parte2: parte2,
                        Parte3: parte3,
                        Parte4: parte4,
                        DataAula: dataAula,
                        professor: STATE.usuarioLogado.NomeCompleto
                    };

                    console.log(`Enviando dados para turma ${turma}:`, dados);
                    return await apiPost('criarTarefa', dados);
                });

                // Aguardar todas as promises
                const results = await Promise.all(promises);
                console.log('Resultados da criação:', results);
                
                UIManager.showModal('Sucesso', `Tarefa criada com sucesso para as turmas: ${turmasSelecionadas.join(', ')}!`);
                
                // Limpar caches
                CacheManager.remove('painel_professor');
                CacheManager.remove('tarefas_professor_lista');
                turmasSelecionadas.forEach(turma => {
                    CacheManager.remove(`relatorio_${turma}`);
                });
                
                limparFormulario();
                await carregarTarefasProfessor();
                
            } catch (error) {
                console.error('Erro detalhado ao criar tarefa:', error);
                UIManager.showModal('Erro', `Erro ao criar tarefa: ${error.message}`);
            } finally {
                Utils.setButtonLoading(btnSalvar, false);
            }
        }

        // ==================== EXCLUSÃO SIMPLIFICADA ====================
        async function excluirTarefaDireto(idTarefa, botao) {
            // Verificar se é o segundo clique (já está confirmando)
            if (botao.getAttribute('data-confirmando') === 'true') {
                console.log('Iniciando exclusão confirmada da tarefa:', idTarefa);
                
                const tarefa = STATE.tarefas.find(t => t.ID === idTarefa);
                if (!tarefa) {
                    UIManager.showModal('Erro', 'Tarefa não encontrada.');
                    return;
                }
                
                // Mostrar loading no botão
                Utils.setButtonLoading(botao, true);
                
                try {
                    const response = await apiPost('excluirTarefa', { ID: idTarefa });
                    
                    if (response.success) {
                        UIManager.showModal('Sucesso', `Tarefa "${tarefa.Tema}" excluída com sucesso!`);
                        
                        // Limpar caches
                        CacheManager.remove('painel_professor');
                        CacheManager.remove('tarefas_professor_lista');
                        CONFIG.TURMAS.forEach(turma => {
                            CacheManager.remove(`relatorio_${turma}`);
                        });
                        
                        // Recarregar a lista de tarefas
                        await carregarTarefasProfessor();
                        
                    } else {
                        throw new Error(response.error || 'Erro desconhecido ao excluir tarefa');
                    }
                    
                } catch (error) {
                    console.error('Erro ao excluir tarefa:', error);
                    UIManager.showModal('Erro', `Falha ao excluir tarefa: ${error.message}`);
                } finally {
                    Utils.setButtonLoading(botao, false);
                }
            } else {
                // Primeiro clique - entrar no modo de confirmação
                const textoOriginal = botao.textContent;
                botao.setAttribute('data-confirmando', 'true');
                botao.textContent = 'Clique novamente para excluir';
                botao.style.backgroundColor = '#dc2626';
                
                // Voltar ao normal após 3 segundos
                setTimeout(() => {
                    if (botao.getAttribute('data-confirmando') === 'true') {
                        botao.setAttribute('data-confirmando', 'false');
                        botao.textContent = textoOriginal;
                        botao.style.backgroundColor = '';
                    }
                }, 3000);
            }
        }

        async function carregarTarefasAluno() {
            const cacheKey = `tarefas_aluno_${STATE.usuarioLogado.Email}_dados`;
            const cached = CacheManager.get(cacheKey);
            
            if (cached) {
                renderTarefasAlunoFromCache(cached.tarefas, cached.entregas);
                return;
            }

            mostrarLoadingTarefasAluno();
            
            try {
                const response = await apiGet('getTarefasPorTurma', { turma: STATE.usuarioLogado.Turma }, true);
                const container = document.getElementById('tarefas-aluno-container');
                
                if (!response.data || response.data.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">Nenhuma tarefa disponível para sua turma.</div>';
                    CacheManager.set(cacheKey, {tarefas: [], entregas: []}, 2 * 60 * 1000);
                    return;
                }

                let entregas = [];
                try {
                    const entregasResponse = await apiGet('getEntregasAluno', { 
                        email: STATE.usuarioLogado.Email, 
                        turma: STATE.usuarioLogado.Turma 
                    }, true);
                    entregas = entregasResponse.data || [];
                } catch (error) {
                    console.warn('Erro ao carregar entregas do aluno (não crítico):', error);
                }

                CacheManager.set(cacheKey, {tarefas: response.data, entregas: entregas}, 2 * 60 * 1000);
                
                renderTarefasAluno(response.data, entregas, container);
                
            } catch (error) {
                document.getElementById('tarefas-aluno-container').innerHTML = 
                    `<div class="text-center text-red-500 py-8">Erro ao carregar tarefas: ${Utils.escapeHTML(error.message || String(error))}</div>`;
            }
        }

        function renderTarefasAlunoFromCache(tarefasLocal, entregas) {
            const container = document.getElementById('tarefas-aluno-container');
            renderTarefasAluno(tarefasLocal, entregas, container);
        }

        function mostrarLoadingTarefasAluno() {
            const container = document.getElementById('tarefas-aluno-container');
            if (!container) return;
            
            container.innerHTML = `
                <div class="text-center py-8">
                    <div class="spinner"></div>
                    <p class="mt-4 text-gray-600">Carregando tarefas...</p>
                </div>
            `;
        }

        function renderTarefasAluno(tarefasLocal, entregas, container) {
            container.innerHTML = '';
            
            if (!tarefasLocal || tarefasLocal.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">Nenhuma tarefa disponível para sua turma.</div>';
                return;
            }

            container.innerHTML = tarefasLocal.map((tarefa, index) => {
                const entregaTarefa = entregas.filter(e => e.ID_Tarefa === `TAREFA_${index + 1}`);
                
                return `
                <div class="border border-gray-200 rounded-lg p-4 mb-4">
                    <h4 class="font-semibold text-lg text-gray-800">${Utils.escapeHTML(tarefa.Tema)}</h4>
                    <p class="text-sm text-gray-600 mt-1">Data da aula: ${Utils.formatarData(tarefa.DataAula)}</p>
                    
                    ${renderParteAluno(tarefa, 1, entregaTarefa, index)}
                    ${renderParteAluno(tarefa, 2, entregaTarefa, index)}
                    ${renderParteAluno(tarefa, 3, entregaTarefa, index)}
                    ${renderParteAluno(tarefa, 4, entregaTarefa, index)}
                </div>
                `;
            }).join('');
        }

        function renderParteAluno(tarefa, numeroParte, entregas, tarefaIndex) {
            const parteConteudo = tarefa[`Parte${numeroParte}`];
            const entrega = entregas.find(e => e.Parte === numeroParte);
            const linkSalvo = entrega ? entrega.Link : '';
            const inputId = `link-${tarefa.ID}-${numeroParte}`;
            const temLinkSalvo = linkSalvo && String(linkSalvo).trim() !== '';
            
            // Calcular status baseado na data atual usando a função corrigida
            const agora = new Date();
            const dataAula = new Date(tarefa.DataAula);
            
            // Calcular data de entrega para cada parte com diasOffset correto
            let diasOffset = 0;
            switch(numeroParte) {
                case 1: diasOffset = 0; break;
                case 2: diasOffset = 7; break;
                case 3: diasOffset = 14; break;
                case 4: diasOffset = 28; break;
                default: diasOffset = 0;
            }
            
            const dataEntrega = new Date(dataAula);
            dataEntrega.setDate(dataEntrega.getDate() + diasOffset);
            
            // Verificar se está dentro do período de entrega (13h-22h do dia correto)
            const inicio = new Date(dataEntrega);
            inicio.setHours(13, 0, 0, 0);
            
            const fim = new Date(dataEntrega);
            fim.setHours(22, 0, 0, 0);
            
            let status = 'aguardando';
            let textoStatus = 'Aguardando';
            let liberada = false;
            
            if (agora < inicio) {
                // Antes do período de entrega
                const diff = inicio - agora;
                const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                
                if (dias > 0) {
                    textoStatus = `Libera em ${dias}d ${horas}h ${minutos}m`;
                } else if (horas > 0) {
                    textoStatus = `Libera em ${horas}h ${minutos}m`;
                } else {
                    textoStatus = `Libera em ${minutos}m`;
                }
                
                status = 'aguardando';
                liberada = false;
            } else if (agora > fim) {
                // Depois do período de entrega
                status = 'expirado';
                textoStatus = 'Expirado';
                liberada = false;
            } else {
                // Dentro do período de entrega
                const diffFim = fim - agora;
                const diasFim = Math.floor(diffFim / (1000 * 60 * 60 * 24));
                const horasFim = Math.floor((diffFim % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutosFim = Math.floor((diffFim % (1000 * 60 * 60)) / (1000 * 60));
                
                if (diasFim > 0) {
                    textoStatus = `Termina em ${diasFim}d ${horasFim}h ${minutosFim}m`;
                } else if (horasFim > 0) {
                    textoStatus = `Termina em ${horasFim}h ${minutosFim}m`;
                } else {
                    textoStatus = `Termina em ${minutosFim}m`;
                }
                
                status = 'disponivel';
                liberada = true;
            }
            
            // Verificar horário para mostrar nota esperada
            const horaAtual = agora.getHours();
            let notaEsperada = '0.0';
            let horarioInfo = '';
            
            if (liberada) {
                if (horaAtual >= 17 && horaAtual < 20) {
                    notaEsperada = '2.5';
                    horarioInfo = '<div class="horario-info horario-maxima">Nota máxima (17h-20h): 2.5</div>';
                } else if ((horaAtual >= 13 && horaAtual < 17) || (horaAtual >= 20 && horaAtual < 22)) {
                    notaEsperada = '2.0';
                    horarioInfo = '<div class="horario-info">Nota regular (13h-17h ou 20h-22h): 2.0</div>';
                } else {
                    horarioInfo = '<div class="horario-info horario-fora">Fora do horário de entrega (13h-22h)</div>';
                }
            }

            // Adicionar labels de retenção para os alunos
            let retencaoLabel = '';
            switch(numeroParte) {
                case 1:
                    retencaoLabel = '<span class="retencao-aviso retencao-50">50% retenção</span>';
                    break;
                case 2:
                    retencaoLabel = '<span class="retencao-aviso retencao-25">25% retenção</span>';
                    break;
                case 3:
                    retencaoLabel = '<span class="retencao-aviso retencao-15">15% retenção</span>';
                    break;
                case 4:
                    retencaoLabel = '<span class="retencao-aviso retencao-10">9.99% retenção</span>';
                    break;
            }
            
            return `
            <div class="mt-3 p-3 bg-gray-50 rounded border">
                <div class="flex justify-between items-center">
                    <strong>Parte ${numeroParte} ${retencaoLabel}</strong>
                    <span class="contador ${status}">${textoStatus}</span>
                </div>
                <div class="conteudo-formatado mt-2">${Utils.escapeHTML(parteConteudo)}</div>
                ${horarioInfo}
                <div class="link-container mt-2">
                    <input type="text" 
                           class="link-input ${temLinkSalvo ? 'link-salvo' : ''}" 
                           placeholder="${temLinkSalvo ? 'Link já enviado' : 'Cole o link da atividade aqui'}" 
                           id="${inputId}"
                           value="${linkSalvo || ''}"
                           ${temLinkSalvo || !liberada ? 'disabled' : ''}>
                    ${!temLinkSalvo ? `
                        <button class="btn-primario btn-link" 
                                onclick="salvarLinkAluno('${tarefa.ID}', ${numeroParte}, this)"
                                id="btn-salvar-${tarefa.ID}-${numeroParte}"
                                ${!liberada ? 'disabled' : ''}>
                            Salvar
                        </button>
                    ` : ''}
                    <button class="btn-secundario btn-link" 
                            onclick="excluirLinkAluno('${tarefa.ID}', ${numeroParte}, this)"
                            id="btn-excluir-${tarefa.ID}-${numeroParte}"
                            ${!temLinkSalvo ? 'disabled' : ''}>
                        Excluir
                    </button>
                </div>
                ${temLinkSalvo ? '<p class="text-green-600 text-sm mt-1">✓ Link salvo com sucesso</p>' : ''}
            </div>`;
        }

        // ==================== FUNÇÕES DE ENTREGA ====================
        async function salvarLinkAluno(idTarefa, parte, botaoSalvar) {
            const input = document.getElementById(`link-${idTarefa}-${parte}`);
            const link = input ? input.value.trim() : '';
            const botaoExcluir = document.getElementById(`btn-excluir-${idTarefa}-${parte}`);
            
            if (!link) {
                UIManager.showModal('Atenção', 'Por favor, cole um link válido.');
                return;
            }

            try {
                // Mostrar loading no botão salvar
                Utils.setButtonLoading(botaoSalvar, true);
                
                await apiPost('entregarTarefa', {
                    ID_Tarefa: idTarefa,
                    Email_Aluno: STATE.usuarioLogado.Email,
                    NomeAluno: STATE.usuarioLogado.NomeCompleto,
                    Turma: STATE.usuarioLogado.Turma,
                    Parte: parte,
                    Link: link
                });
                
                UIManager.showModal('Sucesso', `Link da parte ${parte} salvo com sucesso!`);
                
                CacheManager.remove(`painel_aluno_${STATE.usuarioLogado.Email}`);
                CacheManager.remove(`tarefas_aluno_${STATE.usuarioLogado.Email}_dados`);
                
                // Atualizar a interface manualmente sem recarregar tudo
                input.classList.add('link-salvo');
                input.disabled = true;
                botaoSalvar.disabled = true;
                botaoSalvar.classList.add('hidden');
                botaoExcluir.disabled = false;
                
                // Adicionar mensagem de sucesso
                const mensagemSucesso = document.createElement('p');
                mensagemSucesso.className = 'text-green-600 text-sm mt-1';
                mensagemSucesso.textContent = '✓ Link salvo com sucesso';
                input.parentNode.appendChild(mensagemSucesso);
                
            } catch (error) {
                UIManager.showModal('Erro', `Erro ao salvar link: ${error.message}`);
            } finally {
                Utils.setButtonLoading(botaoSalvar, false);
            }
        }

        async function excluirLinkAluno(idTarefa, parte, botaoExcluir) {
            const input = document.getElementById(`link-${idTarefa}-${parte}`);
            const botaoSalvar = document.getElementById(`btn-salvar-${idTarefa}-${parte}`);
            
            try {
                // Mostrar loading no botão excluir
                Utils.setButtonLoading(botaoExcluir, true);
                
                await apiPost('excluirEntrega', {
                    ID_Tarefa: idTarefa,
                    Email_Aluno: STATE.usuarioLogado.Email,
                    Turma: STATE.usuarioLogado.Turma,
                    Parte: parte
                });
                
                UIManager.showModal('Sucesso', `Link da parte ${parte} excluído com sucesso!`);
                
                CacheManager.remove(`painel_aluno_${STATE.usuarioLogado.Email}`);
                CacheManager.remove(`tarefas_aluno_${STATE.usuarioLogado.Email}_dados`);
                
                // Atualizar a interface manualmente sem recarregar tudo
                input.classList.remove('link-salvo');
                input.disabled = false;
                input.value = '';
                botaoSalvar.disabled = false;
                botaoSalvar.classList.remove('hidden');
                botaoExcluir.disabled = true;
                
                // Remover mensagem de sucesso
                const mensagemSucesso = input.parentNode.querySelector('.text-green-600');
                if (mensagemSucesso) {
                    mensagemSucesso.remove();
                }
                
            } catch (error) {
                UIManager.showModal('Erro', `Erro ao excluir link: ${error.message}`);
            } finally {
                Utils.setButtonLoading(botaoExcluir, false);
            }
        }

        function exportarParaExcel(turma) {
            if (!turma) {
                UIManager.showModal('Atenção', 'Selecione uma turma primeiro.');
                return;
            }
            
            try {
                const table = document.getElementById('tabela-relatorio');
                if (!table) {
                    UIManager.showModal('Erro', 'Tabela não encontrada para exportação.');
                    return;
                }

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.table_to_sheet(table);
                XLSX.utils.book_append_sheet(wb, ws, `Turma ${turma}`);
                XLSX.writeFile(wb, `relatorio_turma_${turma}.xlsx`);
            } catch (error) {
                UIManager.showModal('Erro', `Erro ao exportar para Excel: ${error.message}`);
            }
        }

        function exportarParaPDF(turma) {
            if (!turma) {
                UIManager.showModal('Atenção', 'Selecione uma turma primeiro.');
                return;
            }
            
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFontSize(16);
                doc.text(`Relatório da Turma ${turma}`, 14, 15);

                doc.setFontSize(10);
                doc.text(`Emitido em: ${new Date().toLocaleDateString()}`, 14, 22);

                const table = document.getElementById('tabela-relatorio');
                doc.autoTable({
                    html: table,
                    startY: 30,
                    styles: { fontSize: 8 },
                    headStyles: { fillColor: [204, 0, 0] }
                });

                doc.save(`relatorio_turma_${turma}.pdf`);
            } catch (error) {
                UIManager.showModal('Erro', `Erro ao exportar para PDF: ${error.message}`);
            }
        }

                            </table>
                            <div class="mt-4 p-3 bg-gray-50 rounded border">
                                <div class="flex justify-between items-center">
                                    <span class="font-semibold">Média Geral:</span>

                            </div>

                }
                
                container.innerHTML = relatorioHTML;
            } catch (error) {
                container.innerHTML = `<p class="text-red-500 text-center py-4">Erro ao carregar relatório: ${Utils.escapeHTML(error.message)}</p>`;
            }
        }
