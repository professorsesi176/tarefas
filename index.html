                        <div class="diagnostico-item">
                            <h4 class="font-semibold mb-3">Status do Cache</h4>
                            <div id="status-cache">
                                <div class="text-center py-4">
                                    <div class="spinner"></div>
                                    <p class="mt-2 text-gray-600">Carregando...</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="diagnostico-item">
                            <h4 class="font-semibold mb-3">Estatísticas do Sistema</h4>
                            <div id="estatisticas-sistema">
                                <div class="text-center py-4">
                                    <div class="spinner"></div>
                                    <p class="mt-2 text-gray-600">Carregando...</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="diagnostico-item">
                            <h4 class="font-semibold mb-3">Métricas de Performance</h4>
                            <div id="metricas-performance">
                                <div class="text-center py-4">
                                    <div class="spinner"></div>
                                    <p class="mt-2 text-gray-600">Carregando...</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6">
                        <h4 class="font-semibold mb-3">Informações de Debug</h4>
                        <div id="debug-info">
                            <div class="text-center py-4">
                                <div class="spinner"></div>
                                <p class="mt-2 text-gray-600">Carregando informações de debug...</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            carregarStatusCache();
            carregarEstatisticasSistema();
            carregarMetricasPerformance();
            carregarInformacoesDebug();
        }

        async function testarExclusaoTarefas() {
            const container = document.getElementById('resultado-teste-exclusao');
            container.innerHTML = '<div class="text-center py-4"><div class="spinner"></div><p class="mt-2 text-gray-600">Testando sistema de exclusão...</p></div>';
            
            try {
                // Testar se a função de exclusão está disponível
                const response = await apiGet('testBackend');
                
                let resultadoHTML = `
                    <div class="test-result test-success">
                        <strong>Sistema de Backend:</strong> ${response.message || 'Funcionando'}
                    </div>
                    <div class="debug-section">
                        <div class="debug-title">Detalhes do Teste:</div>
                        <div class="debug-info">
                            Versão: ${response.versao || 'N/A'}<br>
                            Status: ${response.status || 'N/A'}<br>
                            Tarefas Mapeadas: ${response.tarefas_mapeadas || 'N/A'}<br>
                            Teste Exclusão: ${response.teste_exclusao_tarefa || 'N/A'}
                        </div>
                    </div>
                `;
                
                // Testar se podemos obter a lista de tarefas
                try {
                    const tarefasResponse = await apiGet('getTarefas', {}, true);
                    const tarefas = tarefasResponse.data || [];
                    
                    resultadoHTML += `
                        <div class="test-result ${tarefas.length > 0 ? 'test-success' : 'test-warning'}">
                            <strong>Lista de Tarefas:</strong> ${tarefas.length} tarefas carregadas
                        </div>
                        <div class="debug-section">
                            <div class="debug-title">Primeiras 3 Tarefas:</div>
                            <div class="debug-info">
                                ${tarefas.slice(0, 3).map(t => `ID: ${t.ID} | Tema: ${t.Tema} | Turma: ${t.Turma}`).join('<br>')}
                                ${tarefas.length > 3 ? `<br>... e mais ${tarefas.length - 3} tarefas` : ''}
                            </div>
                        </div>
                    `;
                    
                    // Verificar se há tarefas para testar exclusão
                    if (tarefas.length > 0) {
                        resultadoHTML += `
                            <div class="test-result test-success">
                                <strong>Pronto para Teste:</strong> Clique em "Excluir" em qualquer tarefa para testar
                            </div>
                            <div class="mt-4">
                                <button onclick="mostrarPainelProfessor()" class="btn-primario">
                                    Ir para Lista de Tarefas
                                </button>
                            </div>
                        `;
                    } else {
                        resultadoHTML += `
                            <div class="test-result test-warning">
                                <strong>Sem Tarefas:</strong> Crie uma tarefa primeiro para testar a exclusão
                            </div>
                        `;
                    }
                    
                } catch (error) {
                    resultadoHTML += `
                        <div class="test-result test-error">
                            <strong>Erro ao Carregar Tarefas:</strong> ${error.message}
                        </div>
                    `;
                }
                
                container.innerHTML = resultadoHTML;
                
            } catch (error) {
                container.innerHTML = `
                    <div class="test-result test-error">
                        <strong>Erro no Teste:</strong> ${error.message}
                    </div>
                    <div class="debug-section">
                        <div class="debug-title">Detalhes do Erro:</div>
                        <div class="debug-info">${error.stack || 'Sem detalhes adicionais'}</div>
                    </div>
                `;
            }
        }

        function carregarStatusCache() {
            const container = document.getElementById('status-cache');
            
            try {
                const cacheStats = CacheManager.getCacheStats();
                
                container.innerHTML = `
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span>Itens em Cache:</span>
                            <span class="font-semibold">${cacheStats.itens}</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Tamanho do Cache:</span>
                            <span class="font-semibold">${Utils.formatarBytes(cacheStats.tamanho)}</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Eficiência do Cache:</span>
                            <span class="font-semibold">${cacheStats.eficiencia.toFixed(1)}%</span>
                        </div>
                    </div>
                    <button onclick="limparCache()" class="btn-primario w-full mt-3" style="background-color: #ef4444;">Limpar Cache</button>
                `;
            } catch (error) {
                container.innerHTML = `<p class="text-red-500">Erro ao carregar status do cache: ${error.message}</p>`;
            }
        }

        function carregarEstatisticasSistema() {
            const container = document.getElementById('estatisticas-sistema');
            
            try {
                const usuariosCarregados = STATE.usuarioLogado ? 1 : 0;
                const tarefasCarregadas = STATE.tarefas.length;
                const metricasAPI = ApiManager.getMetricas();
                
                container.innerHTML = `
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span>Usuários Carregados:</span>
                            <span class="font-semibold">${usuariosCarregados}</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Tarefas Carregadas:</span>
                            <span class="font-semibold">${tarefasCarregadas}</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Chamadas API:</span>
                            <span class="font-semibold">${metricasAPI.chamadasAPI}</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Tempo Total:</span>
                            <span class="font-semibold">${metricasAPI.tempoTotalAPI.toFixed(2)} ms</span>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<p class="text-red-500">Erro ao carregar estatísticas: ${error.message}</p>`;
            }
        }

        function carregarMetricasPerformance() {
            const container = document.getElementById('metricas-performance');
            
            try {
                // Coletar métricas de performance
                const metrics = performance.getEntriesByType('navigation')[0];
                const memory = performance.memory; // Disponível apenas em alguns navegadores
                const metricasAPI = ApiManager.getMetricas();
                
                let metricsHTML = `
                    <div class="metricas-grid">
                        <div class="metrica-item">
                            <div class="font-semibold">Tempo API</div>
                            <div class="text-lg">${metricasAPI.tempoMedioAPI.toFixed(2)} ms</div>
                            <div class="text-xs text-gray-500">médio por chamada</div>
                        </div>
                        
                        <div class="metrica-item">
                            <div class="font-semibold">Status API</div>
                            <div class="text-lg text-green-600">Online</div>
                            <div class="text-xs text-gray-500">conectado</div>
                        </div>
                        
                        <div class="metrica-item">
                            <div class="font-semibold">Chamadas API</div>
                            <div class="text-lg">${metricasAPI.chamadasAPI}</div>
                            <div class="text-xs text-gray-500">total</div>
                        </div>
                `;
                
                if (memory) {
                    STATE.metricasPerformance.memoriaUsada = memory.usedJSHeapSize;
                    STATE.metricasPerformance.memoriaTotal = memory.totalJSHeapSize;
                    
                    metricsHTML += `
                        <div class="metrica-item">
                            <div class="font-semibold">Memória Usada</div>
                            <div class="text-lg">${(memory.usedJSHeapSize / 1048576).toFixed(2)} MB</div>
                            <div class="text-xs text-gray-500">${((memory.usedJSHeapSize / memory.totalJSHeapSize) * 100).toFixed(1)}%</div>
                        </div>
                        
                        <div class="metrica-item">
                            <div class="font-semibold">Memória Total</div>
                            <div class="text-lg">${(memory.totalJSHeapSize / 1048576).toFixed(2)} MB</div>
                            <div class="text-xs text-gray-500">disponível</div>
                        </div>
                    `;
                } else {
                    metricsHTML += `
                        <div class="metrica-item">
                            <div class="font-semibold">Memória Usada</div>
                            <div class="text-lg">N/A</div>
                            <div class="text-xs text-gray-500">não disponível</div>
                        </div>
                        
                        <div class="metrica-item">
                            <div class="font-semibold">Memória Total</div>
                            <div class="text-lg">N/A</div>
                            <div class="text-xs text-gray-500">não disponível</div>
                        </div>
                    `;
                }
                
                metricsHTML += `</div>`;
                
                // Recomendações
                let recomendacoes = [];
                
                if (memory && memory.usedJSHeapSize / memory.totalJSHeapSize > 0.8) {
                    recomendacoes.push("Considere limpar o cache para liberar memória.");
                }
                
                if (metricasAPI.chamadasAPI > 50) {
                    recomendacoes.push("Muitas chamadas API. Verifique a eficiência das requisições.");
                }
                
                if (metricasAPI.tempoMedioAPI > 1000) {
                    recomendacoes.push("Tempo de resposta da API está alto. Verifique a conexão.");
                }
                
                const cacheStats = CacheManager.getCacheStats();
                if (cacheStats.itens > 50) {
                    recomendacoes.push("Cache muito grande. Considere limpar itens desnecessários.");
                }
                
                if (recomendacoes.length > 0) {
                    metricsHTML += `
                        <div class="mt-3 p-3 bg-yellow-50 rounded border border-yellow-200">
                            <div class="font-semibold text-yellow-800 mb-2">Recomendações:</div>
                            <ul class="text-sm text-yellow-700 list-disc list-inside">
                                ${recomendacoes.map(rec => `<li>${rec}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                metricsHTML += `
                    <div class="mt-3 flex space-x-2">
                        <button onclick="ApiManager.resetMetricas()" class="btn-secundario flex-1 text-sm">
                            Resetar Métricas
                        </button>
                        <button onclick="carregarMetricasPerformance()" class="btn-primario flex-1 text-sm">
                            Atualizar
                        </button>
                    </div>
                `;
                
                container.innerHTML = metricsHTML;
                
            } catch (error) {
                container.innerHTML = `<p class="text-red-500">Erro ao carregar métricas: ${error.message}</p>`;
            }
        }

        function carregarInformacoesDebug() {
            const container = document.getElementById('debug-info');
            
            try {
                const debugInfo = {
                    'URL da API': CONFIG.API_URL,
                    'Tarefas no Estado': STATE.tarefas.length,
                    'Usuário Logado': STATE.usuarioLogado ? `${STATE.usuarioLogado.NomeCompleto} (${STATE.usuarioLogado.Perfil})` : 'Nenhum',
                    'Navegador': navigator.userAgent.substring(0, 50) + '...',
                    'LocalStorage Keys': Object.keys(localStorage).filter(k => k.startsWith('task_')).length,
                    'Timestamp': new Date().toISOString(),
                    'Performance API': performance ? 'Disponível' : 'Indisponível',
                    'Memória API': performance.memory ? 'Disponível' : 'Indisponível'
                };
                
                let debugHTML = '';
                for (const [key, value] of Object.entries(debugInfo)) {
                    debugHTML += `
                        <div class="flex justify-between py-1 border-b">
                            <span class="font-medium">${key}:</span>
                            <span class="text-gray-600">${value}</span>
                        </div>
                    `;
                }
                
                container.innerHTML = debugHTML;
                
            } catch (error) {
                container.innerHTML = `<p class="text-red-500">Erro ao carregar debug: ${error.message}</p>`;
            }
        }

        function limparCache() {
            CacheManager.clear();
            UIManager.showModal('Sucesso', 'Cache limpo com sucesso!');
            setTimeout(() => {
                carregarStatusCache();
                carregarMetricasPerformance();
                carregarInformacoesDebug();
            }, 1000);
        }

        // ==================== INICIALIZAÇÃO ====================
        document.addEventListener('DOMContentLoaded', init);

        // ==================== EXPORTAÇÃO DE FUNÇÕES GLOBAIS ====================
        window.logout = function() {
            AuthManager.logout();
        };

        window.closeModal = function() {
            UIManager.closeModal();
        };

        window.toggleRmVisibility = toggleRmVisibility;
        window.mostrarPainelDiagnostico = mostrarPainelDiagnostico;
        window.limparCache = limparCache;
        window.mostrarPainelProfessor = mostrarPainelProfessor;
        window.mostrarPainelAluno = mostrarPainelAluno;
        window.mostrarRelatorioProfessor = mostrarRelatorioProfessor;
        window.exportarParaExcel = exportarParaExcel;
        window.exportarParaPDF = exportarParaPDF;
        window.carregarRelatorioTurma = carregarRelatorioTurma;
        window.salvarTarefaCorrigida = salvarTarefaCorrigida;
        window.excluirTarefaDireto = excluirTarefaDireto;
        window.editarTarefa = editarTarefa;
        window.limparFormulario = limparFormulario;
        window.salvarLinkAluno = salvarLinkAluno;
        window.excluirLinkAluno = excluirLinkAluno;
        window.toggleRelatorioAluno = toggleRelatorioAluno;
        window.carregarRelatorioAluno = carregarRelatorioAluno;
        window.toggleFundamentoCientifico = toggleFundamentoCientifico;
        window.togglePartesTarefa = togglePartesTarefa;
        window.testarExclusaoTarefas = testarExclusaoTarefas;
        window.carregarMetricasPerformance = carregarMetricasPerformance;
    </script>
